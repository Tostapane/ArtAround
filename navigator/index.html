<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ArtAround — la visita del museo, raccontata." />
    <meta name="theme-color" content="#284b63" />
    <title>ArtAround</title>
    <!--
      Anti-FOUC: applica il tema prima del primo paint. Deve restare inline (piu'
      tardi sarebbe gia' tardi). Stessa chiave localStorage del marketplace: le due
      app condividono la preferenza, cosi' passare dall'una all'altra non cambia
      l'aspetto.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("artaround-theme");
          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
