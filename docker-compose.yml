services:
  mongodb:
    image: mongo:7.0
    container_name: mongo-con
    command: mongod --quiet --logpath /dev/null
    environment:
      MONGO_INITDB_ROOT_USERNAME: localuser
      MONGO_INITDB_ROOT_PASSWORD: localpassword
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db

  node_app:
    image: node:22
    container_name: node-con
    working_dir: /app
    environment:
      - MONGO_URI=mongodb://localuser:localpassword@mongodb:27017/artaround?authSource=admin
      - NAVIGATOR_ORIGIN=http://localhost:8000/navigator
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - /app/navigator/node_modules
      - /app/server/node_modules
      - /app/marketplace/node_modules
    depends_on:
      - mongodb
    # Prova lo stesso artefatto compilato avviato da gocker.
    command: >
      sh -c "npm run setup &&
              npm run build &&
              npm start"

volumes:
  db_data:
