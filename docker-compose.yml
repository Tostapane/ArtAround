services:
  mongodb:
    image: mongo:7.0
    container_name: mongo-con
    command: mongod --quiet --logpath /dev/null
    environment:
      MONGO_INITDB_ROOT_USERNAME: localuser
      MONGO_INITDB_ROOT_PASSWORD: localpassword
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db

  node_app:
    image: node:22
    container_name: node-con
    working_dir: /app
    environment:
      - MONGO_URI=mongodb://localuser:localpassword@mongodb:27017/artaround?authSource=admin
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/navigator/node_modules
      - /app/server/node_modules
      - /app/marketplace/node_modules
    depends_on:
      - mongodb
    # Il marketplace non ha un server di sviluppo: il browser esegue sempre e solo
    # `dist/`. La prima compilazione sta nella catena `&&` perche' un marketplace
    # che non compila deve fermare l'avvio invece di farsi servire vecchio; il
    # watcher che la segue tiene poi `dist/` allineato ai sorgenti per il resto
    # della sessione. Senza, `dist/` resta quello dell'istante in cui il
    # contenitore e' partito e si passa il pomeriggio a leggere il JS di stamattina.
    command: >
      sh -c "npm install --prefix navigator &&
              npm install --prefix server &&
              npm install --prefix marketplace &&
              npm run build --prefix marketplace &&
              (npm run watch --prefix marketplace &) &&
              (npm run dev --prefix navigator -- --host &) &&
              npm run start --prefix server"

volumes:
  db_data:
