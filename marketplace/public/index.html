<!DOCTYPE html>
<html lang="it">

<head>
  <!--
    IL MARKETPLACE: pagina unica. Alpine da /vendor, TypeScript compilato da
    /dist, nessun impacchettatore. Ogni schermata ha un indirizzo: decide `view`,
    guidato dal router a frammento in state.ts. [x-cloak] sulla radice evita che
    le schermate compaiano impilate prima che Alpine parta.

    Le espressioni Alpine sono stringhe: nessun compilatore le controlla e un
    nome sbagliato fallisce in silenzio a schermo (e' costato la tabella delle
    vendite, vuota per settimane dopo una rinomina). Dopo ogni modifica ai
    binding, ricontrollare che ogni chiamata risolva a un membro di AppState. E
    per i dati che arrivano entrando in una schermata servono DUE inneschi, il
    `$watch` e il caso iniziale: entrando dall'indirizzo diretto non scatta.

    Sui radio serve `x-model.boolean`: senza il modificatore il valore che torna
    e' la stringa "false", che e' vera, e ogni `if` prende il ramo
    sbagliato per sempre (e' costato la visita guidata che non tornava piu' in
    vetrina).
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ArtAround: prepara, scopri e vivi la visita di un museo.">
  <title>ArtAround</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link href="/dist/style.css" rel="stylesheet">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("artaround-theme");
        var dark = saved === "dark" ||
          (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) { }
    })();
  </script>
  <!-- Prima del modulo: `i18next` deve stare su window quando app.js si valuta. -->
  <script defer src="/vendor/i18next-26.3.6.min.js"></script>
  <script type="module" src="/dist/marketplace/src/frontend/app.js"></script>
  <script defer src="/vendor/alpine-focus-3.15.0.min.js"></script>
  <script defer src="/vendor/alpine-collapse-3.15.0.min.js"></script>
  <script defer src="/vendor/alpine-3.15.0.min.js"></script>
</head>

<body class="bg-bg text-text font-sans antialiased">

  <svg width="0" height="0" class="absolute" aria-hidden="true" focusable="false">

    <!-- MARCHIO: l'ANGOLO DELLA SALA, con un quadro appeso su ognuna delle tre
         facce. E' una figura ambigua della famiglia del cubo di Necker: la si
         legge come l'angolo dentro cui si sta e come uno spigolo che sporge in
         fuori, e le due letture non si tengono insieme. Dice il pezzo di museo
         che nessuno disegna -- non il quadro, la stanza -- e i tre quadri
         dicono che le opere sono piu' d'una: un catalogo, non un'opera sola.

         ⚠️ I tre spigoli interni vanno dal centro ai DUE VERTICI ALTI E A
         QUELLO IN BASSO, e non ce n'e' un'altra terna che funzioni: puntandoli
         al vertice in cima o a quello in basso a sinistra si ottengono tratti
         che tagliano le facce invece di disegnare il punto in cui i muri si
         toccano, e l'ambiguita' sparisce perche' quelle righe ancorano la
         lettura. L'elenco delle facce e quello degli spigoli devono percio'
         essere d'accordo, e nessuno dei due controlla l'altro.

         Ogni quadro e' doppio: la cornice e la sua battuta. E' quel che gli da'
         profondita' ed e' anche il suo costo, dichiarato scegliendolo -- sotto
         i 28 px i due rombi si impastano. -->

  <div x-data="appData()" x-init="start()" x-cloak class="min-h-[100dvh]">

    <!-- I due salti servono a scavalcare il binario con la tastiera, e compaiono
         solo dove il binario c'e': soglia, accesso e registrazione non montano il
         guscio, quindi li' punterebbero a un elemento display:none e non
         porterebbero da nessuna parte. -->
    <a href="#contenuto" class="salta" x-show="guscioMontato()" x-text="t(`Salta al contenuto`)"></a>
    <a href="#binario" class="salta" x-show="guscioMontato()" x-text="t(`Salta alla navigazione`)"></a>

    <div class="sr-only" role="status" aria-live="polite" x-text="announcement"></div>

    <section x-show="view === 'soglia'" class="relative min-h-[100dvh] overflow-hidden bg-structure text-on-structure">
      <!-- fondale animato -->
      <canvas class="sciame" aria-hidden="true" x-data="swarm()" x-init="start($el)"></canvas>
      <div class="sciame-velo" aria-hidden="true"></div>

      <div class="relative flex min-h-[100dvh] flex-col justify-between p-6 sm:p-10 lg:p-16">
        <!-- LA LINGUA SI SCEGLIE QUI, prima di entrare. E' la schermata che si
             legge per prima, e l'applicazione apre sempre in italiano finche'
             nessuno ha scelto: senza questo campo, chi l'italiano non lo legge
             dovrebbe accedere per trovare il selettore nel binario. I nomi sono
             scritti ciascuno nella propria lingua, cosi' si riconoscono senza
             dover prima leggere l'italiano. -->
        <div class="flex justify-start">
          <div class="w-44">
            <label for="lingua-soglia" class="sr-only" x-text="t('Lingua')"></label>
            <select id="lingua-soglia" class="campo-select campo-select-struttura w-full"
              :value="lingua" @change="cambiaLingua($event.target.value)">
              <template x-for="l in lingueDisponibili" :key="l.translate">
                <option :value="l.translate" x-text="l.name"></option>
              </template>
            </select>
          </div>
        </div>

        <div class="my-auto max-w-4xl py-16">
          <svg class="marchio mb-8 text-accent" viewBox="0 0 64 64" role="img" :aria-label="t(`ArtAround`)">
            <use href="#ico-marchio" />
          </svg>
          <h1 class="font-display text-hero font-semibold leading-[0.9] tracking-[-0.03em]">
            ART<br>AROUND<span class="text-accent">.</span>
          </h1>
          <p class="measure mt-8 text-title-3 text-on-structure/85" x-text="t(`Prepara, scopri e vivi la visita di un museo, alla tua maniera. Scegli un percorso già pronto, componi il tuo, o fatti guidare.`)"></p>
          <!-- DUE PORTE, un accesso solo: la scelta e' dove si va DOPO aver
               detto chi si e', perche' il navigator sta su un'altra origine e
               l'unico modo che ha di sapere chi e' entrato e' il biglietto che
               si conia di qua. -->
          <div class="mt-10 flex flex-col gap-3 sm:flex-row">
            <button type="button" @click="enterFrom('marketplace')" class="btn-primario text-title-3" x-text="t(`Entra nel marketplace`)"></button>
            <button type="button" @click="enterFrom('navigator')" class="btn-fantasma-chiaro text-title-3" x-text="t(`Entra nell'app da museo`)"></button>
          </div>
          <p class="measure mt-4 text-small text-on-structure/70"
            x-text="t(`L'app da museo è quella che si usa camminando: dopo l'accesso si sceglie la visita.`)"></p>
        </div>

      </div>
    </section>

    <section x-show="view === 'accedi'" class="flex min-h-[100dvh] items-center justify-center p-6">
      <div class="w-full max-w-sm">
        <button type="button" @click="goTo('soglia')" class="btn-fantasma mb-8 -ml-3">
          <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-indietro" /></svg> <span x-text="t(`Indietro`)"></span>
        </button>
        <h1 class="font-display text-title-1" :class="entryTarget === 'navigator' ? 'mb-2' : 'mb-8'"
          x-text="t(`Accedi`)"></h1>
        <!-- Chi ha scelto l'app da museo se lo deve ritrovare scritto: dopo
             l'accesso si esce da qui, e un salto non annunciato sembra un
             errore. -->
        <p class="mb-8 text-small text-muted" x-show="entryTarget === 'navigator'"
          x-text="t(`L'app da museo è quella che si usa camminando: dopo l'accesso si sceglie la visita.`)"></p>

        <template x-if="roleChoice">
          <div class="lastra p-6">
            <h2 class="mb-2 font-display text-title-3" x-text="t(`Quale profilo apriamo?`)"></h2>
            <p class="mb-5 text-small text-muted" x-text="t(`Con queste credenziali esistono due profili distinti.`)"></p>
            <div class="flex flex-col gap-3">
              <template x-for="r in roleChoice" :key="r">
                <button type="button" @click="confirmRole(r)" class="scelta text-left">
                  <span class="font-display text-title-3" x-text="roleTitle(r)"></span>
                  <span class="mt-1 block text-small text-muted"
                    x-text="roleHint(r)"></span>
                </button>
              </template>
              <button type="button" @click="roleChoice = null" class="btn-fantasma self-start" x-text="t(`Annulla`)"></button>
            </div>
          </div>
        </template>

        <form x-show="!roleChoice" @submit.prevent="login()" class="lastra flex flex-col gap-5 p-6">
          <div>
            <label for="login-user" class="etichetta" x-text="t(`Username`)"></label>
            <input id="login-user" type="text" x-model="loginForm.username" required autocomplete="username" class="campo">
          </div>
          <div>
            <label for="login-pass" class="etichetta" x-text="t(`Password`)"></label>
            <input id="login-pass" type="password" x-model="loginForm.password" required autocomplete="current-password" class="campo">
          </div>
          <button type="submit" class="btn-primario w-full justify-center" x-text="t(`Accedi`)"></button>
        </form>

        <p class="mt-6 text-small text-muted">
          <span x-text="t(`Non hai un profilo?`)"></span>
          <button type="button" @click="goTo('registrati')" class="link" x-text="t(`Creane uno`)"></button>
        </p>
      </div>
    </section>

    <section x-show="view === 'registrati'" class="flex min-h-[100dvh] items-center justify-center p-6">
      <div class="w-full max-w-md">
        <button type="button" @click="goTo('accedi')" class="btn-fantasma mb-8 -ml-3">
          <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-indietro" /></svg> <span x-text="t(`Indietro`)"></span>
        </button>
        <h1 class="mb-8 font-display text-title-1" x-text="t(`Crea un profilo`)"></h1>

        <form @submit.prevent="register()" class="lastra flex flex-col gap-5 p-6">
          <div>
            <label for="reg-user" class="etichetta" x-text="t(`Username`)"></label>
            <input id="reg-user" type="text" x-model="registerForm.username" required autocomplete="username" class="campo">
          </div>
          <div>
            <label for="reg-pass" class="etichetta" x-text="t(`Password`)"></label>
            <input id="reg-pass" type="password" x-model="registerForm.password" required autocomplete="new-password" class="campo">
          </div>
          <div>
            <label for="reg-conf" class="etichetta" x-text="t(`Ripeti la password`)"></label>
            <input id="reg-conf" type="password" x-model="registerForm.conferma" required autocomplete="new-password" class="campo"
              :aria-describedby="confirmPasswordErrorId()">
            <p x-show="registerForm.conferma && registerForm.password !== registerForm.conferma" id="reg-conf-err"
              class="mt-2 flex items-center gap-2 text-caption text-danger" role="alert">
              <svg class="h-4 w-4 shrink-0" aria-hidden="true"><use href="#ico-attenzione" /></svg>
              <span x-text="t(`Le due password non coincidono.`)"></span>
            </p>
          </div>

          <fieldset>
            <legend class="etichetta" x-text="t(`Che cosa vuoi fare`)"></legend>
            <div class="mt-2 flex flex-col gap-3" role="radiogroup" :aria-label="t(`Tipo di profilo`)">
              <label class="scelta cursor-pointer" :class="registerForm.role === 'visitatore' ? 'scelta-attiva' : ''">
                <input type="radio" name="ruolo" value="visitatore" x-model="registerForm.role" class="sr-only">
                <span class="font-display text-title-3" x-text="t(`Visitatore`)"></span>
                <span class="mt-1 block text-small text-muted" x-text="t(`Compro contenuti, compongo percorsi e li vivo nel museo.`)"></span>
              </label>
              <label class="scelta cursor-pointer" :class="registerForm.role === 'autore' ? 'scelta-attiva' : ''">
                <input type="radio" name="ruolo" value="autore" x-model="registerForm.role" class="sr-only">
                <span class="font-display text-title-3" x-text="t(`Autore`)"></span>
                <span class="mt-1 block text-small text-muted" x-text="t(`Pubblico descrizioni e visite, ne fisso prezzo e licenza.`)"></span>
              </label>
            </div>
          </fieldset>

          <button type="submit" class="btn-primario w-full justify-center" x-text="t(`Crea il profilo`)"></button>
        </form>
      </div>
    </section>

    <div x-show="guscioMontato()" class="lg:flex">

      <!-- Barra compatta (solo telefono) -->
      <header class="sticky top-0 z-30 flex h-[var(--app-bar)] items-center justify-between gap-3 border-b border-line bg-structure px-4 text-on-structure lg:hidden">
        <button type="button" @click="goHome()" class="font-display text-title-3">ArtAround<span class="text-accent">.</span></button>
        <div class="flex items-center gap-2">
          <span x-show="currentUserRole === 'visitatore'" class="tabular text-small" x-text="'€ ' + wallet.toFixed(2)"
            :aria-label="t(`Credito disponibile: {n} euro`, { n: wallet.toFixed(2) })"></span>
          <button type="button" x-data="themeToggle()" @click="toggle()" :aria-pressed="dark" :aria-label="label()"
            class="inline-flex h-11 w-11 items-center justify-center rounded-full text-on-structure hover:bg-on-structure/10">
            <svg class="h-5 w-5" aria-hidden="true"><use :href="dark ? '#ico-sole' : '#ico-luna'" /></svg>
          </button>
          <button type="button" @click="logout()" :aria-label="t(`Esci dal profilo`)"
            class="inline-flex h-11 w-11 items-center justify-center rounded-full text-on-structure hover:bg-on-structure/10">
            <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-esci" /></svg>
          </button>
        </div>
      </header>

      <!-- BINARIO -->
      <nav id="binario" tabindex="-1" :aria-label="t(`Navigazione principale`)"
        class="fixed bottom-0 left-0 right-0 z-30 border-t border-line bg-structure text-on-structure
               lg:sticky lg:top-0 lg:h-[100dvh] lg:w-64 lg:shrink-0 lg:border-r lg:border-t-0">
        <div class="flex h-full flex-col">

          <div class="hidden px-6 pt-7 lg:block">
            <button type="button" @click="goHome()" class="flex items-center gap-2.5 font-display text-title-2" :aria-label="t(`ArtAround, torna alla home`)">
              <svg class="h-7 w-7 shrink-0 text-accent" viewBox="0 0 64 64" aria-hidden="true"><use href="#ico-marchio" /></svg>
              <span>ArtAround<span class="text-accent">.</span></span>
            </button>
            <button type="button" @click="changeMuseum()" class="mt-5 block w-full text-left"
              :aria-label="'Museo: ' + (selectedMuseum ? selectedMuseum.name : '') + '. Cambia museo'">
              <span class="block text-caption uppercase tracking-wider text-on-structure/60" x-text="t(`Museo`)"></span>
              <span class="mt-1 flex items-center gap-2 text-small">
                <svg class="h-4 w-4 shrink-0" aria-hidden="true"><use href="#ico-museo" /></svg>
                <span class="truncate" x-text="selectedMuseum ? selectedMuseum.name : ''"></span>
              </span>
              <span class="text-caption text-accent" x-text="t(`Cambia`)"></span>
            </button>
          </div>

          <ul class="flex justify-around lg:mt-8 lg:flex-col lg:justify-start lg:gap-1 lg:px-3">
            <template x-if="currentUserRole === 'visitatore'">
              <li class="contents">
                <template x-for="v in [
                    {id:'home',     ico:'#ico-banco',    label:t('Home')},
                    {id:'vetrina',  ico:'#ico-visite',   label:t('Vetrina')},
                    {id:'libreria', ico:'#ico-libreria', label:t('Libreria')}
                  ]" :key="v.id">
                  <a :href="'#/' + v.id" class="voce-binario" :class="view === v.id ? 'voce-attiva' : ''"
                    :aria-current="view === v.id ? 'page' : false">
                    <svg class="h-6 w-6 lg:h-5 lg:w-5" aria-hidden="true"><use :href="v.ico" /></svg>
                    <span x-text="v.label"></span>
                  </a>
                </template>
              </li>
            </template>
            <template x-if="currentUserRole === 'autore'">
              <li class="contents">
                <template x-for="v in [
                    {id:'lavori',  ico:'#ico-lavori',  label:t('I miei contenuti')},
                    {id:'nuovo',   ico:'#ico-opere',   label:t('Crea descrizione')},
                    {id:'componi', ico:'#ico-componi', label:t('Crea visita')},
                    {id:'vendite', ico:'#ico-vendite', label:t('Vendite')}
                  ]" :key="v.id">
                  <a :href="'#/' + v.id" class="voce-binario" :class="view === v.id ? 'voce-attiva' : ''"
                    :aria-current="view === v.id ? 'page' : false">
                    <svg class="h-6 w-6 lg:h-5 lg:w-5" aria-hidden="true"><use :href="v.ico" /></svg>
                    <span x-text="v.label"></span>
                  </a>
                </template>
              </li>
            </template>
            <template x-if="currentUserRole === 'curatore'">
              <li class="contents">
                <template x-for="v in [
                    {id:'gestione', ico:'#ico-museo',  label:t('Il museo')},
                    {id:'catalogo', ico:'#ico-lavori', label:t('Catalogo')}
                  ]" :key="v.id">
                  <a :href="'#/' + v.id" class="voce-binario" :class="view === v.id ? 'voce-attiva' : ''"
                    :aria-current="view === v.id ? 'page' : false">
                    <svg class="h-6 w-6 lg:h-5 lg:w-5" aria-hidden="true"><use :href="v.ico" /></svg>
                    <span x-text="v.label"></span>
                  </a>
                </template>
              </li>
            </template>
          </ul>

          <!-- Piede del binario (solo schermo largo) -->
          <div class="mt-auto hidden px-6 pb-7 lg:block">
            <!-- LINGUA: i nomi sono scritti ciascuno nella propria lingua, cosi'
                 si riconoscono senza dover prima leggere l'italiano. Il campo
                 siede sulla struttura e non sulla lastra, quindi prende la
                 variante che non si porta dietro il fondo dell'applicazione. -->
            <div class="mb-4">
              <label for="lingua-binario" class="etichetta-impostazione text-on-structure/60"
                x-text="t('Lingua')"></label>
              <select id="lingua-binario" class="campo-select campo-select-struttura mt-1 w-full"
                :value="lingua" @change="cambiaLingua($event.target.value)">
                <template x-for="l in lingueDisponibili" :key="l.translate">
                  <option :value="l.translate" x-text="l.name"></option>
                </template>
              </select>
            </div>
            <div x-show="currentUserRole === 'visitatore'" class="mb-4">
              <span class="etichetta-impostazione text-on-structure/60" x-text="t('Credito')"></span>
              <span class="valore-su-struttura font-display text-title-3" x-text="'€ ' + wallet.toFixed(2)"
                :aria-label="t(`Credito disponibile: {n} euro`, { n: wallet.toFixed(2) })"></span>
            </div>
            <div class="flex items-center justify-between gap-2 border-t border-on-structure/20 pt-4">
              <span class="min-w-0 truncate text-small" x-text="currentUser"></span>
              <div class="flex shrink-0 items-center">
                <button type="button" x-data="themeToggle()" @click="toggle()" :aria-pressed="dark" :aria-label="label()"
                  class="inline-flex h-11 w-11 items-center justify-center rounded-full hover:bg-on-structure/10">
                  <svg class="h-5 w-5" aria-hidden="true"><use :href="dark ? '#ico-sole' : '#ico-luna'" /></svg>
                </button>
                <button type="button" @click="logout()" :aria-label="t('Esci dal profilo')"
                  class="inline-flex h-11 w-11 items-center justify-center rounded-full hover:bg-on-structure/10">
                  <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-esci" /></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <main id="contenuto" tabindex="-1" class="min-w-0 flex-1 px-4 pb-28 pt-6 sm:px-8 lg:px-12 lg:pb-16 lg:pt-10">
        <div class="mx-auto max-w-5xl">

          <!-- ---------- SCELTA DEL MUSEO ---------- -->
          <section x-show="view === 'musei'">
            <h1 class="font-display text-title-1" x-text="t(`Scegli il museo`)"></h1>
            <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <template x-for="m in museums" :key="m.qid">
                <button type="button" @click="selectMuseum(m)" class="lastra filo-accento p-6 text-left"
                  :aria-label="t(`Entra nel museo {nome}`, { nome: m.name })">
                  <h2 class="font-display text-title-2 leading-tight" x-text="m.name"></h2>
                  <p class="mt-1 text-small text-muted" x-show="m.location" x-text="m.location"></p>
                  <p class="tabular mt-4 text-caption uppercase tracking-wider text-muted" x-text="museumSummary(m)"></p>
                  <span class="mt-4 inline-flex items-center gap-1 text-small font-semibold text-accent">
                    <span x-text="t(`Entra`)"></span> <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-avanti" /></svg>
                  </span>
                </button>
              </template>
            </div>
            <div x-show="museums.length === 0 && !loading" class="vuoto mt-8">
              <p x-text="t(`Nessun museo nel database.`)"></p>
              <p class="mt-1 text-small text-muted" x-text="t(`Esegui il seed del server per popolarlo.`)"></p>
            </div>
          </section>

          <!-- ---------- LA HOME (visitatore) ---------- -->
          <section x-show="view === 'home'">
            <h1 class="font-display text-title-1">
              <span x-text="t(`Cosa vuoi fare a {museo}?`, { museo: selectedMuseum ? selectedMuseum.name : '' })"></span>
            </h1>

            <div class="mt-8 grid gap-4 md:grid-cols-2">
              <a href="#/sumisura" class="lastra filo-accento filo-iride flex flex-col p-6">
                <span class="tessera-iride">
                  <svg class="h-6 w-6" aria-hidden="true"><use href="#ico-scintilla" /></svg>
                </span>
                <h2 class="mt-4 font-display text-title-2" x-text="t(`Raccontaci che visita vuoi`)"></h2>
                <p class="mt-2 flex-1 text-small text-muted" x-text="t(`Descrivi la giornata che hai in mente: il percorso nasce da lì.`)"></p>
                <span class="mt-4 inline-flex items-center gap-1 text-small font-semibold text-accent">
                  <span x-text="t(`Descrivi la visita`)"></span> <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-avanti" /></svg>
                </span>
              </a>
              <a href="#/vetrina" @click="setMarketType('visite')" class="lastra filo-accento flex flex-col p-6">
                <svg class="h-8 w-8 text-accent" aria-hidden="true"><use href="#ico-visite" /></svg>
                <h2 class="mt-4 font-display text-title-2" x-text="t(`Scegli una visita pronta`)"></h2>
                <p class="mt-2 flex-1 text-small text-muted" x-text="t(`Percorsi già composti, gratuiti o a pagamento.`)"></p>
                <span class="mt-4 inline-flex items-center gap-1 text-small font-semibold text-accent">
                  <span x-text="t(`Vedi le visite`)"></span> <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-avanti" /></svg>
                </span>
              </a>
              <a href="#/componi" @click="openComposer()" class="lastra filo-accento flex flex-col p-6">
                <svg class="h-8 w-8 text-accent" aria-hidden="true"><use href="#ico-componi" /></svg>
                <h2 class="mt-4 font-display text-title-2" x-text="t(`Componi il tuo percorso`)"></h2>
                <p class="mt-2 flex-1 text-small text-muted" x-text="t(`Scegli tu le opere, l'ordine e cosa è opzionale.`)"></p>
                <span class="mt-4 inline-flex items-center gap-1 text-small font-semibold text-accent">
                  <span x-text="t(`Apri il compositore`)"></span> <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-avanti" /></svg>
                </span>
              </a>
              <div class="lastra flex flex-col p-6">
                <svg class="h-8 w-8 text-accent" aria-hidden="true"><use href="#ico-chiave" /></svg>
                <h2 class="mt-4 font-display text-title-2" x-text="t(`Ho una parola chiave`)"></h2>
                <p class="mt-2 text-small text-muted" x-text="t(`Entra nella visita guidata della tua classe.`)"></p>
                <form @submit.prevent="joinWithPasskey()" class="mt-4 flex flex-col gap-2">
                  <label for="passkey" class="sr-only" x-text="t(`Parola chiave della visita guidata`)"></label>
                  <input id="passkey" type="text" x-model="passkeyInput" :placeholder="t(`Fenice rossa`)" autocomplete="off"
                    class="campo font-mono">
                  <button type="submit" class="btn-secondario justify-center" x-text="t(`Entra`)"></button>
                </form>
              </div>
            </div>

            <!-- Sessione trovata: si passa al navigator -->
            <div x-show="guidedSession" class="lastra mt-4 flex flex-col gap-3 border-l-4 border-l-accent p-5 sm:flex-row sm:items-center">
              <p class="flex-1 text-small">
                <span x-text="t(`Sei in sala d'attesa per {visita}.`, { visita: guidedSession?.visitName })"></span>
                <span x-text="t(`Apri l'app da museo e aspetta che il docente dia il via.`)"></span>
              </p>
              <button type="button" @click="openNavigator(waitingRoomUrl())" class="btn-primario shrink-0">
                <span x-text="t(`Vai alla sala d'attesa`)"></span> <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-esterno" /></svg>
              </button>
            </div>

            <template x-if="myVisits().length > 0">
              <div class="mt-12">
                <h2 class="font-display text-title-2" x-text="t(`Riprendi`)"></h2>
                <ul class="mt-4 flex flex-col gap-3">
                  <template x-for="v in myVisits().slice(0, 4)" :key="v['@id']">
                    <li class="lastra flex flex-col gap-3 p-4 sm:flex-row sm:items-center">
                      <div class="min-w-0 flex-1">
                        <a :href="'#/visita/' + encodeURIComponent(v['@id'])" class="font-display text-title-3 link-scuro" x-text="v.name"></a>
                        <p class="tabular text-small text-muted" x-text="visitSummary(v)"></p>
                      </div>
                      <template x-if="visitUsable(v)">
                        <button type="button" @click="openNavigator(navigatorUrl(v))" class="btn-primario shrink-0" :aria-label="t(`Inizia la visita {nome}`, { nome: v.name })">
                          <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-avvia" /></svg> <span x-text="t(`Inizia`)"></span>
                        </button>
                      </template>
                      <template x-if="!visitUsable(v)">
                        <a :href="'#/visita/' + encodeURIComponent(v['@id'])" class="btn-secondario shrink-0" x-text="t(`Completa`)"></a>
                      </template>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </section>

          <!-- ---------- LA VETRINA: visite e opere in un posto solo ---------- -->
          <section x-show="view === 'vetrina'">
            <h1 class="font-display text-title-1" x-text="t(`Vetrina`)"></h1>
            <p class="mt-1 text-small text-muted">
              <span class="tabular" x-text="marketSummary()"></span>
              <span x-text="' · ' + (selectedMuseum ? selectedMuseum.name : '')"></span>
            </p>

            <div class="barra mt-6">
              <div class="campo-cerca">
                <svg class="h-5 w-5 shrink-0 text-muted" aria-hidden="true"><use href="#ico-cerca" /></svg>
                <label for="cerca-vetrina" class="sr-only" x-text="t(`Cerca in vetrina`)"></label>
                <input id="cerca-vetrina" type="search" x-model.debounce.250ms="marketSearch"
                  :placeholder="t(`Cerca una visita, un'opera, un pittore…`)"
                  @input.debounce.300ms="announce(marketSummary())">
              </div>
              <div class="flex flex-wrap gap-3">
                <div class="segmenti" role="group" :aria-label="t(`Che cosa mostrare`)">
                  <template x-for="f in [{v:'tutti',label:t(`Tutto`)},{v:'visite',label:t(`Visite`)},{v:'opere',label:t(`Opere`)},{v:'meta',label:t(`Soggetti`)}]" :key="f.v">
                    <button type="button" class="segmento" :class="marketType === f.v ? 'segmento-attivo' : ''"
                      :aria-pressed="marketType === f.v" @click="setMarketType(f.v)" x-text="f.label"></button>
                  </template>
                </div>
                <div>
                  <label for="f-liv-vetrina" class="sr-only" x-text="t(`Filtra per livello`)"></label>
                  <select id="f-liv-vetrina" x-model="marketLevelFilter" class="campo-select">
                    <option value="tutti" x-text="t(`Ogni livello`)"></option>
                    <template x-for="d in availableLevels()" :key="d"><option :value="d" x-text="t(d)"></option></template>
                    <option x-show="marketType !== 'opere'" value="misto" x-text="t(`Misto (più livelli)`)"></option>
                  </select>
                </div>
                <div x-show="marketDurationOptions().length > 0">
                  <label for="f-dur-vetrina" class="sr-only" x-text="t(`Filtra per durata`)"></label>
                  <select id="f-dur-vetrina" x-model="marketDurationFilter" class="campo-select">
                    <option value="tutti" x-text="t(`Ogni durata`)"></option>
                    <template x-for="o in marketDurationOptions()" :key="o.value">
                      <option :value="o.value" x-text="o.label"></option>
                    </template>
                  </select>
                </div>
              </div>
            </div>

            <!-- La durata di una visita sta in minuti, quella di una descrizione in
                 secondi: un filtro solo per tutt'e due sarebbe una trappola. -->
            <p x-show="marketType === 'tutti'" class="mt-2 text-caption text-muted" x-text="t(`Scegli Visite, Opere o Soggetti per filtrare anche per durata.`)"></p>

            <!-- ---------- LE VISITE ---------- -->
            <section x-show="shownVisits().length > 0" class="mt-10" aria-labelledby="vetrina-visite">
              <h2 id="vetrina-visite" x-show="marketType === 'tutti'"
                class="font-display text-title-2" x-text="t(`Visite`)"></h2>
              <div class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                <template x-for="v in shownVisits()" :key="v['@id']">
                  <article class="lastra group relative flex flex-col overflow-hidden transition-colors hover:border-accent"
                    x-data="{ rotta: false }">
                    <!-- CON COPERTINA la tessera e' quella di un'opera: la stessa
                         dissolvenza, e il titolo che risale dentro la sua coda.
                         SENZA, la copertina E' il titolo, sulla struttura: e'
                         come le visite si sono sempre viste, e resta il ripiego
                         perche' una visita non ha una fotografia per natura.
                         `rotta` copre il caso dell'immagine che non si carica:
                         la tessera torna al titolo invece di aprire un buco. -->
                    <template x-if="visitImage(v) && !rotta">
                      <span class="dissolvenza">
                        <img :src="visitImage(v)" @error="rotta = true" alt="" loading="lazy"
                          class="group-hover:scale-[1.04]">
                      </span>
                    </template>
                    <template x-if="!visitImage(v) || rotta">
                      <h3 class="copertina filo-accento">
                        <span x-text="v.name"></span>
                      </h3>
                    </template>
                    <div class="flex flex-1 flex-col p-5"
                      :class="visitImage(v) && !rotta ? 'relative -mt-16' : ''">
                      <h3 x-show="visitImage(v) && !rotta"
                        class="mb-1 font-display text-title-3 leading-tight" x-text="v.name"></h3>
                      <p class="tabular text-small text-muted" x-text="visitSummary(v)"></p>
                      <p class="mt-1 text-caption uppercase tracking-wider text-muted">
                        <span x-text="t(`Curatore: {nome}`, { nome: v.author || 'n/d' })"></span>
                      </p>
                      <div class="mt-5 flex items-center justify-between gap-3 border-t border-line pt-4">
                        <span class="valore font-display text-title-3" x-text="visitPrice(v)"></span>
                        <!-- I comandi si tirano SOPRA il velo del collegamento
                             (z-30 contro z-20), o se li mangerebbe: e' la ragione
                             per cui la tessera di una visita non poteva usarlo
                             prima che i suoi bottoni fossero sollevati. -->
                        <template x-if="visitUsable(v)">
                          <button type="button" @click="openNavigator(navigatorUrl(v))" class="btn-primario relative z-30" :aria-label="t(`Inizia la visita {nome}`, { nome: v.name })">
                            <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-avvia" /></svg> <span x-text="t(`Inizia`)"></span>
                          </button>
                        </template>
                        <template x-if="!visitUsable(v) && inLibrary(v)">
                          <a :href="'#/visita/' + encodeURIComponent(v['@id'])" class="btn-secondario relative z-30" x-text="t(`Completa`)"></a>
                        </template>
                        <template x-if="!inLibrary(v) && canBuy()">
                          <button type="button" @click="buy(v)" class="btn-primario relative z-30" :aria-label="'Sblocca ' + v.name" x-text="t(`Sblocca`)"></button>
                        </template>
                        <template x-if="!inLibrary(v) && !canBuy()">
                          <a :href="'#/visita/' + encodeURIComponent(v['@id'])" class="btn-secondario relative z-30" x-text="t(`Apri`)"></a>
                        </template>
                      </div>
                    </div>
                    <!-- Ultimo figlio della tessera: la copre tutta, copertina
                         compresa, cosi' si apre la scheda toccandola in
                         qualunque punto e non solo sul titolo. -->
                    <a :href="'#/visita/' + encodeURIComponent(v['@id'])"
                      class="tessera-intera"
                      :aria-label="t(`Apri {nome}`, { nome: v.name })"></a>
                  </article>
                </template>
              </div>
            </section>

            <!-- ---------- LE OPERE, con le loro descrizioni ---------- -->
            <section x-show="shownArtworks().length > 0" class="mt-10" aria-labelledby="vetrina-opere">
              <h2 id="vetrina-opere" x-show="marketType === 'tutti'"
                class="font-display text-title-2" x-text="t(`Opere e soggetti`)"></h2>
              <div class="mt-4 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                <template x-for="g in shownArtworks()" :key="g.artwork['@id']">
                  <article class="lastra group relative flex flex-col overflow-hidden transition-colors hover:border-accent"
                    x-data="{ rotta: false }">
                    <!-- La figura non e' piu' un collegamento suo: a portare alla
                         scheda e' il titolo, stirato su tutta la tessera. -->
                    <span class="dissolvenza">
                      <img x-show="artworkImage(g.artwork) && !rotta" :src="artworkImage(g.artwork)" @error="rotta = true"
                        :alt="'Immagine dell\'opera: ' + (g.artwork.name || '')" loading="lazy"
                        class="group-hover:scale-[1.04]">
                    </span>
                    <!-- Il testo risale dentro la coda della dissolvenza: il titolo
                         raggiunge l'immagine invece di essere annunciato sotto di lei. -->
                    <div class="relative -mt-16 flex flex-1 flex-col p-5">
                      <h3 class="font-display text-title-3 leading-tight"
                        x-text="g.artwork.name || 'Senza titolo'"></h3>
                      <p class="mt-1 text-small text-muted" x-text="g.artwork.author ? g.artwork.author.name : ''"></p>
                      <p class="mt-auto flex flex-wrap items-baseline gap-x-2 pt-4 text-caption uppercase tracking-wider">
                        <span class="tabular text-slate" x-text="artworkCount(g)"></span>
                        <span class="text-muted" aria-hidden="true">·</span>
                        <span class="valore" x-text="artworkFromPrice(g)"></span>
                      </p>
                    </div>
                    <!-- Ultimo figlio della tessera: copre tutto, figura compresa. -->
                    <a :href="'#/opera/' + encodeURIComponent(g.artwork.qid || g.artwork['@id'])"
                      class="tessera-intera"
                      :aria-label="t(`Apri {nome}`, { nome: g.artwork.name || 'senza titolo' })"></a>
                  </article>
                </template>
              </div>
            </section>

            <div x-show="marketEmpty()" class="vuoto mt-8">
              <p x-show="marketFiltered()" x-text="t(`Niente in vetrina con questi filtri.`)"></p>
              <p x-show="!marketFiltered()" x-text="t(`In questo museo non c'è ancora niente pubblicato.`)"></p>
              <button type="button" class="btn-secondario mt-4" x-show="marketFiltered()"
                @click="resetMarketFilters()" x-text="t(`Azzera i filtri`)"></button>
            </div>
          </section>

          <section x-show="view === 'opera'" x-data="{ rotta: false }">
            <a href="#/vetrina" class="btn-fantasma -ml-3 mb-6">
              <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-indietro" /></svg> <span x-text="t(`Torna alle opere`)"></span>
            </a>
            <template x-if="currentArtwork()">
              <div>
              <!-- L'INTESTAZIONE E' UNA FASCIA, non due colonne alte uguali: il
                   quadro sta a sinistra con la sua altezza, il testo gli si
                   affianca al centro. In due colonne l'immagine dettava
                   l'altezza e sotto le tre righe di scheda restava mezzo
                   schermo vuoto. -->
              <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
                <!-- La figura si stringe con un'ALTEZZA massima, non con una
                     larghezza: il catalogo ha quadri sdraiati e quadri in piedi,
                     e un vincolo sulla larghezza lascia il verticale alto il
                     doppio dell'orizzontale. Col tetto in altezza tutte le opere
                     occupano la stessa fascia, qualunque proporzione abbiano. -->
                <div class="sm:w-64 sm:shrink-0 lg:w-72">
                  <img x-show="artworkImage(currentArtwork()) && !rotta" class="figura w-auto max-h-72 max-w-full shadow-l1"
                    :src="artworkImage(currentArtwork())" @error="rotta = true"
                    :alt="'Immagine dell\'opera: ' + (currentArtwork().name || '')">
                  <p x-show="!artworkImage(currentArtwork()) || rotta" class="senza-figura" x-text="currentArtwork().name"></p>
                </div>

                <div class="min-w-0">
                  <h1 class="font-display text-title-1 leading-tight" x-text="currentArtwork().name"></h1>
                  <!-- Il conto e' quello MOSTRATO, non quello totale: e' la
                       risposta al filtro appena scelto. -->
                  <p class="tabular mt-2 text-small text-muted" role="status"
                    x-text="artworkItemsCount()"></p>
                  <!-- Le voci della scheda stanno in RIGA e vanno a capo da
                       sole: sono due o tre parole ciascuna, e incolonnate
                       lasciavano vuota tutta la larghezza che avevano. -->
                  <dl class="mt-6 flex flex-wrap gap-x-8 gap-y-2 text-small">
                    <div class="flex gap-2" x-show="currentArtwork().kind">
                      <dt class="text-muted" x-text="t(`Genere`)"></dt>
                      <dd x-text="kindName(currentArtwork().kind)"></dd>
                    </div>
                    <!-- Autore e stile portano ai contenuti che ne parlano, se
                         qualcuno ne ha scritti: sono soggetti anche loro. -->
                    <div class="flex gap-2" x-show="!currentArtwork().kind">
                      <dt class="text-muted" x-text="t(`Autore`)"></dt>
                      <dd>
                        <a x-show="linkAutore()" :href="linkAutore()" class="link-scuro" x-text="nomeAutore()"></a>
                        <span x-show="!linkAutore()" x-text="nomeAutore() || 'n/d'"></span>
                      </dd>
                    </div>
                    <!-- Lo stile sparisce quando non c'e': Wikidata non lo
                         dichiara per quasi meta' del catalogo, e una riga che
                         ripete "n/d" su tante opere e' rumore, non un dato.
                         L'autore invece resta, perche' manca di rado e li' il
                         vuoto e' una notizia. -->
                    <div class="flex gap-2" x-show="!currentArtwork().kind && nomeStile()">
                      <dt class="text-muted" x-text="t(`Stile`)"></dt>
                      <dd>
                        <a x-show="linkStile()" :href="linkStile()" class="link-scuro" x-text="nomeStile()"></a>
                        <span x-show="!linkStile()" x-text="nomeStile()"></span>
                      </dd>
                    </div>
                  </dl>

                  <!-- I DUE FILTRI della vetrina, con le voci di quest'opera.
                       Le tendine compaiono solo se c'e' davvero qualcosa da
                       separare: su un'opera con un tono solo sarebbero due menu
                       da una voce. -->
                  <div class="mt-6 flex flex-wrap items-center gap-3">
                    <div x-show="artworkLevels().length > 1">
                      <label for="f-liv-opera" class="sr-only" x-text="t(`Filtra per livello`)"></label>
                      <select id="f-liv-opera" x-model="artworkLevelFilter" class="campo-select">
                        <option value="tutti" x-text="t(`Ogni livello`)"></option>
                        <template x-for="liv in artworkLevels()" :key="liv">
                          <option :value="liv" x-text="t(liv)"></option>
                        </template>
                      </select>
                    </div>
                    <div x-show="artworkDurations().length > 1">
                      <label for="f-dur-opera" class="sr-only" x-text="t(`Filtra per durata`)"></label>
                      <select id="f-dur-opera" x-model="artworkDurationFilter" class="campo-select">
                        <option value="tutti" x-text="t(`Ogni durata`)"></option>
                        <template x-for="s in artworkDurations()" :key="s">
                          <option :value="String(s)" x-text="t(`{n} secondi di lettura`, { n: s })"></option>
                        </template>
                      </select>
                    </div>
                    <button type="button" x-show="artworkFiltered()" class="btn-fantasma"
                      @click="resetArtworkFilters()" x-text="t(`Azzera i filtri`)"></button>
                  </div>
                </div>
              </div>

              <!-- Le descrizioni prendono tutta la larghezza della schermata, e
                   sono la stessa griglia della vetrina: un'opera ne ha una
                   ventina, e in colonna sola si scorreva per due schermate con
                   mezzo schermo vuoto accanto. La terza colonna arriva solo da
                   `xl`, dove una tessera resta abbastanza larga da tenere i due
                   bottoni sulla stessa riga.

                   `items-start` perche' aprendo una descrizione la griglia
                   allungherebbe tutta la riga: le vicine resterebbero vuote
                   alte quanto il testo appena aperto. -->
              <ul class="mt-10 grid items-start gap-3 sm:grid-cols-2 xl:grid-cols-3">
                <template x-for="it in shownArtworkItems()" :key="it['@id']">
                  <li class="lastra p-4" :class="inLibrary(it) ? 'lastra-posseduta' : ''">
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
                      <span class="pastiglia" :class="toneClass(it.educationalLevel)" x-text="t(it.educationalLevel)"></span>
                      <span class="pastiglia pastiglia-durata tabular"
                        x-text="t(`{n} secondi di lettura`, { n: it.timeRequired })"></span>
                      <span class="text-caption text-muted"
                        x-text="t(`Curatore: {nome}`, { nome: it.author || 'n/d' })"></span>
                      <span x-show="it.visibility === 'privato'" class="pastiglia pastiglia-ametista" x-text="t(`Privato`)"></span>
                      <span class="valore ml-auto font-display text-title-3" x-text="readablePrice(it.price)"></span>
                    </div>
  
                    <div class="mt-4 flex flex-wrap items-center gap-2">
                      <!-- Si legge quel che si PUO' leggere (canRead), non quel che
                           si e' preso (inLibrary): una descrizione gratuita il server
                           la manda comunque, e nasconderla dietro "Ottieni" era
                           chiedere di prendere per avere quel che si aveva gia'. -->
                      <template x-if="canRead(it)">
                        <button type="button" @click="toggleItem(it['@id'])" class="btn-secondario"
                          :aria-expanded="openItems.includes(it['@id'])"
                          :aria-label="toggleDescriptionLabel(it)">
                          <span x-text="openItems.includes(it['@id']) ? 'Chiudi' : 'Leggi'"></span>
                          <svg class="h-4 w-4" aria-hidden="true"><use :href="openItems.includes(it['@id']) ? '#ico-su' : '#ico-giu'" /></svg>
                        </button>
                      </template>
                      <template x-if="!canRead(it) && canBuy()">
                        <button type="button" @click="buy(it)" class="btn-primario"
                          :aria-label="'Sblocca la descrizione ' + it.educationalLevel + ' di ' + currentArtwork().name" x-text="t(`Sblocca`)"></button>
                      </template>
                      <!-- Tenerla e' un'altra cosa dal leggerla: la libreria e' quel
                           che ti sei preso, e ci si arriva anche da gratis. -->
                      <template x-if="canRead(it) && !inLibrary(it) && canBuy()">
                        <button type="button" @click="buy(it)" class="btn-secondario"
                          :aria-label="'Tieni in libreria la descrizione ' + it.educationalLevel + ' di ' + currentArtwork().name" x-text="t(`Tieni in libreria`)"></button>
                      </template>
                      <template x-if="currentUserRole === 'autore' && it.author === currentUser">
                        <button type="button" @click="editItem(it)" class="btn-secondario">
                          <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-modifica" /></svg> <span x-text="t(`Modifica`)"></span>
                        </button>
                      </template>
                      <span x-show="inLibrary(it)" class="inline-flex items-center gap-1 text-caption text-sage">
                        <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-check" /></svg> <span x-text="t(`Nella tua libreria`)"></span>
                      </span>
                    </div>
  
                    <div x-show="openItems.includes(it['@id'])" x-collapse class="mt-4 border-t border-line pt-4">
                      <p class="measure text-body" x-text="it.text"></p>
                      <!-- `break-words`: i contenuti seminati prima della
                           migrazione portano la licenza scritta come indirizzo,
                           che in una colonna da 300 px e' una parola sola piu'
                           larga della tessera. -->
                      <p class="mt-3 break-words text-caption uppercase tracking-wider text-muted">
                        <span x-show="!licenseHref(it.license)" x-text="t(`Licenza: {nome}`, { nome: it.license || 'n/d' })"></span>
                        <a x-show="licenseHref(it.license)" :href="licenseHref(it.license)"
                          target="_blank" rel="noopener noreferrer" class="link-scuro"
                          x-text="t(`Licenza: {nome}`, { nome: it.license })"></a>
                      </p>
                    </div>
                  </li>
                </template>
              </ul>

              <!-- Due vuoti diversi: un'opera senza descrizioni chiede di
                   scriverne una, un filtro che non trova niente chiede di
                   togliere il filtro. -->
              <div x-show="artworkItems().length === 0" class="vuoto mt-6">
                <p x-text="t(`Quest'opera non ha ancora descrizioni.`)"></p>
                <button x-show="currentUserRole === 'autore'" type="button" class="btn-primario mt-4"
                  @click="openNewItem(); draft.selectedArtworkUri = currentArtwork()['@id']" x-text="t(`Scrivine una`)"></button>
              </div>
              <div x-show="artworkItems().length > 0 && shownArtworkItems().length === 0" class="vuoto mt-6">
                <p x-text="t(`Nessuna descrizione disponibile.`)"></p>
                <button type="button" class="btn-secondario mt-4"
                  @click="resetArtworkFilters()" x-text="t(`Azzera i filtri`)"></button>
              </div>
              </div>
            </template>
            <div x-show="!currentArtwork()" class="vuoto"><p x-text="t(`Opera non trovata.`)"></p></div>
          </section>

          <!-- ---------- SCHEDA VISITA ---------- -->
          <section x-show="view === 'visita'">
            <button type="button" @click="history.back()" class="btn-fantasma -ml-3 mb-6">
              <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-indietro" /></svg> <span x-text="t(`Indietro`)"></span>
            </button>
            <template x-if="currentVisit()">
              <div x-data="{ rotta: false }">
                <!-- La copertina, se c'e', apre la pagina come la figura apre
                     quella di un'opera: tetto in ALTEZZA, perche' la carica chi
                     compone e puo' avere qualunque proporzione. -->
                <img x-show="visitImage(currentVisit()) && !rotta" :src="visitImage(currentVisit())"
                  @error="rotta = true" alt=""
                  class="figura mb-6 w-auto max-h-72 max-w-full shadow-l1">
                <div class="flex flex-wrap items-start justify-between gap-4">
                  <div class="min-w-0">
                    <h1 class="font-display text-title-1 leading-tight" x-text="currentVisit().name"></h1>
                    <p class="tabular mt-2 text-small text-muted" x-text="visitSummary(currentVisit())"></p>
                    <p class="mt-1 text-caption uppercase tracking-wider text-muted">
                      <span x-text="t(`Curatore: {nome}`, { nome: currentVisit().author || 'n/d' })"></span> ·
                      <span x-show="!licenseHref(currentVisit().license)" x-text="t(`Licenza: {nome}`, { nome: currentVisit().license || 'n/d' })"></span>
                      <a x-show="licenseHref(currentVisit().license)" :href="licenseHref(currentVisit().license)"
                        target="_blank" rel="noopener noreferrer" class="link-scuro"
                        x-text="t(`Licenza: {nome}`, { nome: currentVisit().license })"></a>
                    </p>
                  </div>
                  <span class="valore font-display text-title-1" x-text="visitPrice(currentVisit())"></span>
                </div>

                <div class="mt-6 flex flex-wrap gap-3">
                  <template x-if="visitUsable(currentVisit())">
                    <button type="button" @click="openNavigator(navigatorUrl(currentVisit()))" class="btn-primario text-title-3">
                      <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-avvia" /></svg> <span x-text="t(`Inizia la visita`)"></span>
                    </button>
                  </template>
                  <template x-if="!inLibrary(currentVisit()) && currentUserRole === 'visitatore'">
                    <button type="button" @click="buy(currentVisit())" class="btn-primario text-title-3"
                      x-text="visitPurchaseLabel()"></button>
                  </template>
                  <template x-if="inLibrary(currentVisit()) && !visitUsable(currentVisit()) && canBuy()">
                    <button type="button" @click="openCompleteVisit(currentVisit())" class="btn-primario"
                      x-text="unlockMissingLabel()"></button>
                  </template>
                  <template x-if="currentVisit().author === currentUser">
                    <span class="flex gap-3">
                      <button type="button" @click="editVisit(currentVisit())" class="btn-secondario">
                        <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-modifica" /></svg> <span x-text="t(`Modifica`)"></span>
                      </button>
                      <button type="button" @click="openDeleteVisit(currentVisit())" class="btn-pericolo">
                        <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-elimina" /></svg> <span x-text="t(`Elimina`)"></span>
                      </button>
                    </span>
                  </template>
                  <template x-if="currentVisit().accessKey && currentVisit().author === currentUser">
                    <button type="button" @click="openNavigator(startGuidedUrl(currentVisit()))" class="btn-primario">
                      <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-avvia" /></svg> <span x-text="t(`Apri la sala d'attesa`)"></span>
                    </button>
                  </template>
                </div>

                <p x-show="inLibrary(currentVisit()) && !visitUsable(currentVisit())"
                  class="avviso mt-4" role="status">
                  <svg class="h-5 w-5 shrink-0" aria-hidden="true"><use href="#ico-attenzione" /></svg>
                  <span x-text="missingItemsNote()"></span>
                </p>

                <template x-if="visitUsable(currentVisit())">
                  <div class="lastra mt-6 flex flex-col gap-4 p-5 sm:flex-row sm:items-center">
                    <img :src="visitQrUrl(currentVisit())" width="132" height="132"
                      class="h-33 w-33 shrink-0 rounded-plate bg-white p-2"
                      :alt="'Codice QR per aprire «' + currentVisit().name + '» sul telefono'">
                    <div class="min-w-0">
                      <h2 class="font-display text-title-3" x-text="t(`Portala sul telefono`)"></h2>
                      <p class="mt-1 text-small text-muted" x-text="t(`Inquadra il codice con la fotocamera: la visita si apre nell'app da museo. Tienila aperta mentre cammini.`)"></p>
                      <button type="button" @click="openNavigator(navigatorUrl(currentVisit()))" class="link mt-2 inline-block text-small" x-text="t(`Oppure aprila qui`)"></button>
                    </div>
                  </div>
                </template>

                <template x-if="currentVisit().accessKey">
                  <div class="lastra mt-6 border-l-4 border-l-accent p-5">
                    <p class="text-caption uppercase tracking-wider text-muted" x-text="t(`Parola chiave`)"></p>
                    <p class="font-mono text-title-2" x-text="currentVisit().accessKey"></p>
                    <p class="mt-2 text-small text-muted" x-text="t(`Questa visita non è in vetrina: ci si entra solo con la parola chiave.`)"></p>
                  </div>
                </template>

                <h2 class="mt-12 font-display text-title-2" x-text="t(`Il percorso`)"></h2>

                <template x-if="openingNotes(currentVisit()).length > 0">
                  <ul class="mt-4 flex flex-col gap-2">
                    <template x-for="note in openingNotes(currentVisit())">
                      <li class="nota-logistica">
                        <svg class="h-4 w-4 shrink-0" aria-hidden="true"><use href="#ico-nota" /></svg>
                        <span x-text="note"></span>
                      </li>
                    </template>
                  </ul>
                </template>

                <!-- IL PERCORSO E' UNA GRIGLIA DI TESSERE, la stessa forma con
                     cui le opere si vedono in vetrina: una visita e' fatta di
                     opere, e in riga se ne leggevano quattro per schermata con
                     la figura ridotta a una striscia di 136 px.

                     L'ordine resta quello del percorso -- e' un <ol>, e il
                     numero sta sulla figura -- perche' una griglia si legge per
                     righe e da sola non direbbe qual e' la prima tappa.

                     Le note logistiche restano DENTRO la tappa a cui sono
                     agganciate: e' li' che il navigator le fa sentire, e
                     staccarle da lei vorrebbe dire perdere il punto del percorso
                     in cui valgono. -->
                <ol class="mt-4 grid items-start gap-4 sm:grid-cols-2 xl:grid-cols-3">
                  <template x-for="tappa in visitStops(currentVisit())" :key="tappa.id">
                    <li>
                      <div class="lastra flex flex-col overflow-hidden">
                        <span class="dissolvenza">
                          <img x-show="itemImage(tappa.id)" :src="itemImage(tappa.id)" alt="" loading="lazy">
                          <span class="numero-tappa" x-text="String(tappa.numero).padStart(2,'0')"></span>
                        </span>
                        <!-- Il testo risale nella coda della dissolvenza, come
                             nella tessera di un'opera. -->
                        <div class="relative -mt-12 flex flex-1 flex-col p-4">
                          <p class="font-display text-title-3 leading-tight" x-text="tappa.nome"></p>
                          <p class="mt-3 flex flex-wrap items-center gap-2">
                            <span x-show="itemTone(tappa.id)" class="pastiglia" :class="toneClass(itemTone(tappa.id))" x-text="t(itemTone(tappa.id))"></span>
                            <span x-show="itemSeconds(tappa.id)" class="pastiglia pastiglia-durata tabular"
                              x-text="t(`{n} secondi di lettura`, { n: itemSeconds(tappa.id) })"></span>
                            <span x-show="tappa.opzionale" class="pastiglia pastiglia-accento" x-text="t(`Opzionale`)"></span>
                          </p>
                        </div>
                      </div>
                      <template x-for="note in notesAfter(currentVisit(), tappa.id)">
                        <p class="nota-logistica">
                          <svg class="h-4 w-4 shrink-0" aria-hidden="true"><use href="#ico-nota" /></svg>
                          <span x-text="note"></span>
                        </p>
                      </template>
                    </li>
                  </template>
                </ol>

                <template x-if="currentVisit().quiz && currentVisit().quiz.length > 0">
                  <div class="mt-12">
                    <h2 class="font-display text-title-2">
                      <span x-text="t(`Quiz di fine visita`)"></span>
                      <span class="tabular text-title-3 text-muted" x-text="'(' + currentVisit().quiz.length + ')'"></span>
                    </h2>
                    <ol class="mt-4 flex flex-col gap-4">
                      <template x-for="(q, qi) in currentVisit().quiz" :key="qi">
                        <li class="lastra p-5">
                          <p class="font-medium"><span class="tabular" x-text="(qi+1) + '. '"></span><span x-text="q.question"></span></p>
                          <ul class="mt-3 flex flex-col gap-1.5">
                            <template x-for="(opt, oi) in q.options" :key="oi">
                              <li class="flex items-center gap-2 text-small" :class="oi === q.correct ? 'font-medium text-accent' : 'text-muted'">
                                <svg x-show="oi === q.correct" class="h-4 w-4 shrink-0" aria-hidden="true"><use href="#ico-check" /></svg>
                                <span x-show="oi !== q.correct" class="h-4 w-4 shrink-0" aria-hidden="true"></span>
                                <span x-text="opt"></span>
                                <span x-show="oi === q.correct" class="sr-only" x-text="t(`(risposta corretta)`)"></span>
                              </li>
                            </template>
                          </ul>
                        </li>
                      </template>
                    </ol>
                  </div>
                </template>
              </div>
            </template>
            <div x-show="!currentVisit()" class="vuoto"><p x-text="t(`Visita non trovata.`)"></p></div>
          </section>

          <section x-show="view === 'libreria'">
            <h1 class="font-display text-title-1" x-text="t(`La mia libreria`)"></h1>
            <p class="mt-1 text-small text-muted"><span x-text="t(`Quello che possiedi in {museo}.`, { museo: selectedMuseum ? selectedMuseum.name : '' })"></span></p>

            <div class="barra mt-6">
              <div class="campo-cerca">
                <svg class="h-5 w-5 shrink-0 text-muted" aria-hidden="true"><use href="#ico-cerca" /></svg>
                <label for="cerca-lib" class="sr-only" x-text="t(`Cerca nella libreria`)"></label>
                <input id="cerca-lib" type="search" x-model="librarySearch" :placeholder="t(`Cerca…`)">
              </div>
              <a href="#/componi" @click="openComposer()" class="btn-secondario shrink-0">
                <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-componi" /></svg> <span x-text="t(`Componi una visita`)"></span>
              </a>
            </div>

            <h2 class="mt-10 font-display text-title-2" x-text="t(`Visite`)"></h2>
            <ul class="mt-4 flex flex-col gap-3">
              <template x-for="v in myVisits()" :key="v['@id']">
                <li class="lastra flex flex-col gap-3 p-4 sm:flex-row sm:items-center">
                  <div class="min-w-0 flex-1">
                    <a :href="'#/visita/' + encodeURIComponent(v['@id'])" class="font-display text-title-3 link-scuro" x-text="v.name"></a>
                    <p class="tabular text-small text-muted" x-text="visitSummary(v)"></p>
                    <p x-show="!visitUsable(v)" class="mt-1 text-caption text-muted"
                      x-text="'Contiene ' + mancantiDi(v) + ' contenuti da sbloccare'"></p>
                  </div>
                  <template x-if="visitUsable(v)">
                    <button type="button" @click="openNavigator(navigatorUrl(v))" class="btn-primario shrink-0" :aria-label="t(`Inizia la visita {nome}`, { nome: v.name })">
                      <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-avvia" /></svg> <span x-text="t(`Inizia`)"></span>
                    </button>
                  </template>
                  <template x-if="!visitUsable(v) && canBuy()">
                    <button type="button" @click="openCompleteVisit(v)" class="btn-secondario shrink-0"
                      x-text="unlockVisitLabel(v)"></button>
                  </template>
                  <template x-if="!visitUsable(v) && !canBuy()">
                    <a :href="'#/visita/' + encodeURIComponent(v['@id'])" class="btn-secondario shrink-0" x-text="t(`Apri`)"></a>
                  </template>
                </li>
              </template>
            </ul>
            <div x-show="myVisits().length === 0" class="vuoto mt-4">
              <p x-text="t(`Non hai ancora visite.`)"></p>
              <a href="#/vetrina" @click="setMarketType('visite')" class="btn-primario mt-4" x-text="t(`Vai alle visite`)"></a>
            </div>

            <h2 class="mt-12 font-display text-title-2" x-text="t(`Descrizioni`)"></h2>
            <div class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              <template x-for="g in myItemGroups()" :key="g.artwork['@id']">
                <a :href="'#/opera/' + encodeURIComponent(g.artwork.qid || g.artwork['@id'])"
                  class="lastra riga-figurata filo-accento" x-data="{ rotta: false }">
                  <span class="figura-riga">
                    <img x-show="artworkImage(g.artwork) && !rotta" :src="artworkImage(g.artwork)" @error="rotta = true" alt="" loading="lazy">
                  </span>
                  <span class="riga-corpo self-center">
                    <span class="block truncate font-medium" x-text="g.artwork.name"></span>
                    <span class="tabular block text-caption text-muted"
                      x-text="artworkCount(g)"></span>
                  </span>
                </a>
              </template>
            </div>
            <div x-show="myItemGroups().length === 0" class="vuoto mt-4">
              <p x-text="t(`Non hai ancora descrizioni.`)"></p>
              <a href="#/vetrina" @click="setMarketType('opere')" class="btn-primario mt-4" x-text="t(`Sfoglia le opere`)"></a>
            </div>
          </section>

          <section x-show="view === 'lavori'">
            <div class="flex flex-wrap items-end justify-between gap-4">
              <div>
                <h1 class="font-display text-title-1" x-text="t(`I miei contenuti`)"></h1>
                <p class="mt-1 text-small text-muted"><span x-text="t(`Quello che hai pubblicato in {museo}.`, { museo: selectedMuseum ? selectedMuseum.name : '' })"></span></p>
              </div>
              <a :href="qrSheetUrl()" target="_blank" rel="noopener" class="btn-secondario">
                <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-qr" /></svg> <span x-text="t(`Stampa i QR delle opere`)"></span>
              </a>
            </div>

            <div class="barra mt-6">
              <div class="campo-cerca">
                <svg class="h-5 w-5 shrink-0 text-muted" aria-hidden="true"><use href="#ico-cerca" /></svg>
                <label for="cerca-lav" class="sr-only" x-text="t(`Cerca nei tuoi contenuti`)"></label>
                <input id="cerca-lav" type="search" x-model="worksSearch" :placeholder="t(`Cerca…`)">
              </div>
              <div role="radiogroup" :aria-label="t(`Filtra per tipo`)" class="segmenti">
                <template x-for="f in [{v:'tutti',t:'Tutti'},{v:'item',t:'Descrizioni'},{v:'visite',t:'Visite'}]" :key="f.v">
                  <button type="button" role="radio" :aria-checked="worksTypeFilter === f.v"
                    @click="worksTypeFilter = f.v" :class="worksTypeFilter === f.v ? 'segmento-attivo' : ''"
                    class="segmento" x-text="f.t"></button>
                </template>
              </div>
            </div>

            <template x-if="workVisits().length > 0">
              <div class="mt-10">
                <h2 class="font-display text-title-2" x-text="t(`Visite`)"></h2>
                <ul class="mt-4 flex flex-col gap-3">
                  <template x-for="v in workVisits()" :key="v['@id']">
                    <li class="lastra flex flex-col gap-3 p-4 sm:flex-row sm:items-center">
                      <div class="min-w-0 flex-1">
                        <a :href="'#/visita/' + encodeURIComponent(v['@id'])" class="font-display text-title-3 link-scuro" x-text="v.name"></a>
                        <p class="tabular text-small text-muted" x-text="visitSummary(v)"></p>
                        <p class="mt-1 flex flex-wrap items-center gap-2">
                          <span x-show="v.accessKey" class="pastiglia pastiglia-ametista">
                            <svg class="h-3.5 w-3.5" aria-hidden="true"><use href="#ico-chiave" /></svg>
                            <span x-text="v.accessKey"></span>
                          </span>
                          <span class="tabular text-caption text-muted" x-show="adoptionsOf(v['@id']) !== null"
                            x-text="adoptionsOf(v['@id']) + ' adozioni'"></span>
                        </p>
                      </div>
                      <div class="flex shrink-0 gap-2">
                        <template x-if="v.accessKey">
                          <button type="button" @click="openNavigator(startGuidedUrl(v))" class="btn-primario" :aria-label="'Apri la sala d\'attesa di ' + v.name">
                            <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-avvia" /></svg> <span x-text="t(`Sala d'attesa`)"></span>
                          </button>
                        </template>
                        <button type="button" @click="editVisit(v)" class="btn-secondario">
                          <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-modifica" /></svg> <span x-text="t(`Modifica`)"></span>
                        </button>
                      </div>
                    </li>
                  </template>
                </ul>
              </div>
            </template>

            <template x-if="workItemGroups().length > 0">
              <div class="mt-12">
                <h2 class="font-display text-title-2" x-text="t(`Descrizioni`)"></h2>
                <div class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                  <template x-for="g in workItemGroups()" :key="g.artwork['@id']">
                    <a :href="'#/opera/' + encodeURIComponent(g.artwork.qid || g.artwork['@id'])"
                      class="lastra riga-figurata filo-accento" x-data="{ rotta: false }">
                      <span class="figura-riga">
                        <img x-show="artworkImage(g.artwork) && !rotta" :src="artworkImage(g.artwork)" @error="rotta = true" alt="" loading="lazy">
                      </span>
                      <span class="riga-corpo self-center">
                        <span class="block truncate font-medium" x-text="g.artwork.name"></span>
                        <span class="tabular block text-caption text-muted"
                          x-text="artworkCount(g)"></span>
                      </span>
                    </a>
                  </template>
                </div>
              </div>
            </template>

            <div x-show="workItemGroups().length === 0 && workVisits().length === 0" class="vuoto mt-8">
              <p x-text="t(`Non hai ancora pubblicato nulla in questo museo.`)"></p>
              <div class="mt-4 flex flex-wrap justify-center gap-3">
                <button type="button" @click="openNewItem()" class="btn-primario" x-text="t(`Scrivi una descrizione`)"></button>
                <button type="button" @click="openComposer()" class="btn-secondario" x-text="t(`Componi una visita`)"></button>
              </div>
            </div>
          </section>

          <!-- ---------- EDITOR DESCRIZIONE ---------- -->
          <section x-show="view === 'nuovo'" class="max-w-5xl">
            <h1 class="font-display text-title-1" x-text="editingId ? 'Modifica la descrizione' : 'Nuova descrizione'"></h1>
            <p class="mt-1 text-small text-muted" x-text="t(`I metadati sono il prodotto: lunghezza, linguaggio, autore e licenza accompagnano il testo ovunque vada.`)"></p>

            <div class="mt-8 grid gap-8 lg:grid-cols-[minmax(0,1fr)_18rem]">

            <form @submit.prevent="saveItem()" class="flex flex-col gap-8">
              <div>
                <label for="ed-genere" class="etichetta" x-text="t(`Di che cosa parli?`)"></label>
                <select id="ed-genere" x-model="draft.genere" :disabled="!!editingId" class="campo">
                  <template x-for="k in itemKinds" :key="k.id">
                    <option :value="k.id" x-text="k.label"></option>
                  </template>
                </select>
                <p class="mt-1 text-caption text-muted" x-text="t(`Un contenuto puo' descrivere un'opera oppure cio' che le sta intorno: uno stile, un movimento, un artista, un periodo.`)"></p>
              </div>

              <!-- L'OPERA, oppure il soggetto scritto: sono la stessa domanda -->
              <div x-show="draft.genere === 'opera'">
                <label for="ed-opera" class="etichetta" x-text="t(`Opera`)"></label>
                <select id="ed-opera" x-model="draft.selectedArtworkUri" :disabled="!!editingId" class="campo">
                  <option value="" x-text="t(`Scegli un'opera…`)"></option>
                  <template x-for="a in museumArtworks()" :key="a['@id']">
                    <option :value="a['@id']" x-text="a.name"></option>
                  </template>
                </select>
              </div>

              <div x-show="draft.genere !== 'opera'" class="flex flex-col gap-4">
                <div>
                  <label for="ed-soggetto" class="etichetta" x-text="t(`Soggetto`)"></label>
                  <input id="ed-soggetto" type="text" class="campo" x-model="draft.soggetto"
                    :disabled="!!editingId" list="ed-soggetti" :placeholder="t(`Manierismo, Caravaggio, Quattrocento…`)">
                  <datalist id="ed-soggetti">
                    <template x-for="n in topicSuggestions()" :key="n">
                      <option :value="n"></option>
                    </template>
                  </datalist>
                  <p class="mt-1 text-caption text-muted" x-show="topicSuggestions().length" x-text="t(`I nomi suggeriti sono quelli che le opere di questo museo usano gia': scriverlo uguale collega il contenuto alle opere che lo nominano.`)"></p>
                </div>

                <div>
                  <label for="ed-immagine" class="etichetta" x-text="t(`Immagine (facoltativa)`)"></label>
                  <input id="ed-immagine" type="file" accept="image/jpeg,image/png,image/webp"
                    class="campo" @change="caricaImmagine($event)">
                  <p class="mt-1 text-caption text-muted" x-text="t(`Senza, la tappa mostra l'opera davanti a cui si trova chi l'ascolta. Caricane una se il soggetto ha una figura sua. JPG, PNG o WebP, fino a 4 MB.`)"></p>
                </div>
              </div>

              <fieldset>
                <legend class="etichetta" x-text="t(`Tono`)"></legend>
                <p class="mt-1 text-caption text-muted" x-text="t(`Dello stesso soggetto puoi scrivere più letture, anche nello stesso tono.`)"></p>
                <div class="mt-3 grid gap-2 sm:grid-cols-2" role="radiogroup" :aria-label="t(`Tono della descrizione`)">
                  <template x-for="tono in tones" :key="tono">
                    <label class="scelta" :class="[
                        draft.tono === tono ? 'scelta-attiva' : '',
                        editingId ? 'opacity-50' : 'cursor-pointer'
                      ]">
                      <input type="radio" name="tono" :value="tono" x-model="draft.tono"
                        :disabled="!!editingId" class="sr-only">
                      <span class="font-medium" x-text="t(tono)"></span>
                      <span class="mt-1 block text-caption text-muted" x-text="t(toneHints[tono])"></span>
                    </label>
                  </template>
                </div>
              </fieldset>

              <div>
                <label for="ed-durata" class="etichetta" x-text="t(`Durata della lettura (secondi)`)"></label>
                <input id="ed-durata" type="number" min="1" x-model="draft.durata" :disabled="!!editingId" class="campo w-40 tabular">
              </div>

              <div>
                <label for="ed-testo" class="etichetta" x-text="t(`Testo`)"></label>
                <textarea id="ed-testo" x-model="draft.testo" rows="9" class="campo"
                  :aria-describedby="'ed-testo-stima'"></textarea>
                <p id="ed-testo-stima" class="tabular mt-2 text-caption text-muted" x-text="readingEstimate()" aria-live="polite"></p>
              </div>

              <div class="grid gap-6 sm:grid-cols-2">
                <div x-show="!draft.privato">
                  <label for="ed-prezzo" class="etichetta" x-text="t(`Prezzo (€)`)"></label>
                  <input id="ed-prezzo" type="number" step="0.10" min="0" x-model="draft.price" class="campo tabular">
                </div>
                <div>
                  <label for="ed-licenza" class="etichetta" x-text="t(`Licenza`)"></label>
                  <select id="ed-licenza" x-model="draft.license" :disabled="!!editingId" class="campo">
                    <template x-for="l in licenseOptions" :key="l"><option :value="l" x-text="l"></option></template>
                  </select>
                </div>
              </div>

              <label class="scelta cursor-pointer" :class="[draft.privato ? 'scelta-attiva' : '', !!editingId ? 'opacity-50' : '']">
                <span class="flex items-start gap-3">
                  <input type="checkbox" x-model="draft.privato" :disabled="!!editingId" class="mt-1 h-5 w-5 shrink-0 accent-[var(--accent)]">
                  <span>
                    <span class="font-medium" x-text="t(`Tienila privata`)"></span>
                    <span class="mt-1 block text-caption text-muted" x-text="t(`Non compare in vetrina e non si vende: la usi solo nelle tue visite guidate.`)"></span>
                  </span>
                </span>
              </label>

              <p x-show="!!editingId" class="avviso" role="note">
                <svg class="h-5 w-5 shrink-0" aria-hidden="true"><use href="#ico-attenzione" /></svg>
                <span x-text="t(`Opera, tono, durata, licenza e visibilità restano fissi: cambiarli danneggerebbe chi ha già adottato questa descrizione.`)"></span>
              </p>

              <div class="barra-salva">
                <p class="text-small" :class="itemIssues().length ? 'text-muted' : 'text-sage'" role="status">
