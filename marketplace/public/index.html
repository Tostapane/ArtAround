                  <span x-show="itemIssues().length" x-text="'Manca ancora: ' + itemIssues().join(', ') + '.'"></span>
                  <span x-show="!itemIssues().length" x-text="t(`Pronta da pubblicare.`)"></span>
                </p>
                <button type="submit" class="btn-primario" x-text="editingId ? 'Salva le modifiche' : 'Pubblica'"></button>
              </div>
            </form>

            <!-- L'OPERA, sotto gli occhi mentre si scrive. Da lg in su resta
                 appiccicata in alto, perche' serve proprio quando si e' arrivati
                 al testo, cioe' quando la scelta e' gia' fuori schermo. Sotto
                 lg no: fra questa e la barra di salvataggio, che e' appiccicata
                 in basso, su un telefono non resterebbe schermo per scrivere. -->
            <aside class="order-first lg:order-none">
              <div class="lastra p-4 lg:sticky lg:top-6 lg:z-10" x-data="{ rotta: false }">
                <template x-if="draftSubject()">
                  <div>
                    <img x-show="artworkImage(draftSubject()) && !rotta" class="figura max-h-40 lg:max-h-72"
                      :src="artworkImage(draftSubject())"
                      @error="rotta = true" :alt="'Immagine di ' + (draftSubject().name || '')">
                    <p x-show="!artworkImage(draftSubject()) || rotta" class="senza-figura"
                      x-text="draftSubject().name || 'Senza immagine'"></p>
                    <p class="mt-3 font-medium" x-text="draftSubject().name"></p>
                    <template x-for="f in draftSubjectFacts()" :key="f">
                      <p class="text-caption text-muted" x-text="f"></p>
                    </template>
                  </div>
                </template>
                <p x-show="!draftSubject()" class="text-small text-muted" x-text="t(`Scegli il soggetto e lo vedi qui mentre scrivi.`)"></p>
              </div>
            </aside>

            </div>
          </section>

          <!-- ---------- VISITA SU MISURA ---------- -->
          <section x-show="view === 'sumisura'" class="max-w-2xl">
            <span class="tessera-iride"><svg class="h-6 w-6" aria-hidden="true"><use href="#ico-scintilla" /></svg></span>
            <h1 class="mt-4 font-display text-title-1" x-text="t(`Raccontaci che visita vuoi`)"></h1>
            <p class="mt-2 text-body text-muted">
              <span x-text="t(`Descrivi il tempo che hai, con chi sei, cosa ti interessa. Le opere vengono scelte fra quelle di {museo} e le descrizioni scritte su quello che hai chiesto.`, { museo: selectedMuseum ? selectedMuseum.name : t(`questo museo`) })"></span>
            </p>

            <label for="sumisura-testo" class="mt-6 block text-small font-semibold" x-text="t(`La visita che vorresti`)"></label>
            <textarea id="sumisura-testo" x-model="customRequest" rows="4"
              class="campo mt-2 resize-y"
              :placeholder="t(`Ho solo mezz'ora e vorrei vedere i ritratti.`)"></textarea>

            <div class="barra-salva filo-iride mt-6 pl-5">
              <p class="text-small" :class="customReady() ? 'text-sage' : 'text-muted'" role="status">
                <span x-show="!customRequest.trim()" x-text="t(`Scrivi una frase: bastano poche parole.`)"></span>
                <span x-show="customRequest.trim()" x-text="t(`Pronta. Si apre nell'app da museo.`)"></span>
              </p>
              <button type="button" @click="openNavigator(customVisitUrl())" class="btn-iride"
                :disabled="!customReady()"
                :class="customReady() ? '' : 'opacity-50'">
                <span x-text="t(`Componi e inizia`)"></span> <svg class="h-5 w-5" aria-hidden="true"><use href="#ico-esterno" /></svg>
              </button>
            </div>

            <p class="mt-6 text-small text-muted">
              <span x-text="t(`Una visita su misura non si salva in libreria: vive il tempo che la percorri. Per tenerne una,`)"></span>
              <a href="#/componi" @click="openComposer()" class="link" x-text="t(`componila dal catalogo`)"></a>.
            </p>
          </section>

          <section x-show="view === 'componi'" class="max-w-none">
            <h1 class="font-display text-title-1" x-text="editingId ? 'Modifica la visita' : 'Componi una visita'"></h1>

            <!-- L'altra strada: descriverla invece di sceglierla tappa per tappa.
                 NON all'autore: una visita su misura non si salva, e lui il
                 compositore lo apre per pubblicare. Offrirgliela vorrebbe dire
                 promettergli un contenuto che non resta. -->
            <template x-if="!editingId && currentUserRole !== 'autore'">
              <div class="lastra filo-iride mt-4 flex flex-col gap-3 p-4 pl-5 sm:flex-row sm:items-center">
                <span class="tessera-iride">
                  <svg class="h-6 w-6" aria-hidden="true"><use href="#ico-scintilla" /></svg>
                </span>
                <p class="flex-1 text-small" x-text="t(`Non hai voglia di sceglierle una per una? Descrivi la visita che vorresti e la trovi già composta.`)"></p>
                <a href="#/sumisura" class="btn-secondario shrink-0" x-text="t(`Raccontala a parole`)"></a>
              </div>
            </template>

            <nav class="passi mt-6" :aria-label="t(`Passi della composizione`)">
              <template x-for="(p, i) in (currentUserRole === 'autore'
                  ? [{id:'percorso',t:'Percorso'},{id:'impostazioni',t:'Impostazioni'},{id:'quiz',t:'Quiz'}]
                  : [{id:'percorso',t:'Percorso'},{id:'impostazioni',t:'Impostazioni'}])" :key="p.id">
                <button type="button" @click="visitStep = p.id" class="passo"
                  :class="visitStep === p.id ? 'passo-attivo' : ''" :aria-current="visitStep === p.id ? 'step' : false"
                  :disabled="p.id === 'quiz' && !draft.guidata">
                  <span class="tabular" x-text="(i+1) + '.'"></span> <span x-text="p.t"></span>
                </button>
              </template>
            </nav>

            <!-- PASSO 1: il percorso, con la libreria accanto -->
            <div x-show="visitStep === 'percorso'" class="mt-6">
              <div role="tablist" :aria-label="t(`Pannelli del compositore`)" class="segmenti mb-4 lg:hidden">
                <button type="button" role="tab" :aria-selected="editorPane === 'percorso'" @click="editorPane='percorso'"
                  class="segmento" :class="editorPane === 'percorso' ? 'segmento-attivo' : ''">
                  <span x-text="t(`Percorso ({n})`, { n: stopCount() })"></span>
                </button>
                <button type="button" role="tab" :aria-selected="editorPane === 'libreria'" @click="editorPane='libreria'"
                  class="segmento" :class="editorPane === 'libreria' ? 'segmento-attivo' : ''" x-text="t(`Libreria`)"></button>
              </div>

              <div class="grid gap-8 lg:grid-cols-[minmax(0,2fr)_minmax(0,3fr)]">
                <div x-show="editorPane === 'percorso'" class="lg:!block">
                  <label for="v-titolo" class="etichetta" x-text="t(`Titolo della visita`)"></label>
                  <input id="v-titolo" type="text" x-model="draft.titolo" class="campo" :placeholder="t(`I capolavori in mezz'ora`)">

                  <div class="mt-6 flex items-baseline justify-between">
                    <h2 class="font-display text-title-3" x-text="t(`Il percorso`)"></h2>
                    <span class="tabular text-caption text-muted" x-text="draftSummary()"></span>
                  </div>

                  <ol class="mt-3 flex flex-col gap-2">
                    <template x-for="(stop, index) in draft.tappe" :key="index">
                      <li class="lastra riga-figurata" :class="stop.tipo === 'logistica' ? 'bg-surface-2' : ''">
                        <!-- La tappa porta la sua opera, la nota logistica no: non e' una
                             tappa, e la riga lo dice prima di essere letta. -->
                        <span x-show="stop.tipo === 'item'" class="figura-riga figura-riga-corta">
                          <img x-show="itemImage(stop.value)" :src="itemImage(stop.value)" alt="" loading="lazy">
                          <span class="numero-tappa" x-text="String(stopNumber(index)).padStart(2,'0')"></span>
                        </span>
                        <span x-show="stop.tipo === 'logistica'" class="flex w-12 shrink-0 items-center justify-center self-stretch">
                          <svg class="h-5 w-5 text-muted" aria-hidden="true"><use href="#ico-nota" /></svg>
                        </span>

                        <div class="riga-corpo flex items-center gap-3">
                          <div class="min-w-0 flex-1">
                          <template x-if="stop.tipo === 'item'">
                            <div>
                              <p class="line-clamp-2 font-medium" x-text="itemName(stop.value)"></p>
                              <p class="text-caption text-muted" x-text="itemDetail(stop.value)"></p>
                            </div>
                          </template>
                          <template x-if="stop.tipo === 'logistica'">
                            <div>
                              <label :for="'nota-' + index" class="sr-only" x-text="t(`Indicazione logistica`)"></label>
                              <input :id="'nota-' + index" type="text" x-model="stop.value" class="campo campo-piatto italic"
                                :placeholder="t(`Prosegui a sinistra della scala verso la sala 12`)">
                            </div>
                          </template>
                          </div>

                        <div class="flex shrink-0 items-center gap-1">
                          <button type="button" x-show="stop.tipo === 'item'" @click="toggleOptional(index)"
                            :aria-pressed="!!stop.opzionale"
                            :aria-label="toggleOptionalLabel(stop.opzionale, index)"
                            class="pastiglia-bottone" :class="stop.opzionale ? 'pastiglia-attiva' : ''" x-text="t(`Opzionale`)"></button>
                          <div class="flex flex-col">
                            <button type="button" @click="moveStop(index, -1)" :disabled="index === 0"
                              :aria-label="'Sposta in su la posizione ' + (index+1)" class="icona-mini">
                              <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-su" /></svg>
                            </button>
                            <button type="button" @click="moveStop(index, 1)" :disabled="index === draft.tappe.length - 1"
                              :aria-label="'Sposta in giù la posizione ' + (index+1)" class="icona-mini">
                              <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-giu" /></svg>
                            </button>
                          </div>
                          <button type="button" @click="removeStop(index)" :aria-label="'Rimuovi la posizione ' + (index+1)"
                            class="icona-mini text-danger">
                            <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-chiudi" /></svg>
                          </button>
                        </div>
                        </div>
                      </li>
                    </template>
                  </ol>

                  <div x-show="draft.tappe.length === 0" class="vuoto mt-3">
                    <p x-text="t(`Il percorso è vuoto.`)"></p>
                    <p class="mt-1 text-small text-muted" x-text="t(`Aggiungi le descrizioni dalla libreria qui accanto.`)"></p>
                  </div>

                  <button type="button" @click="addStop('logistica')" class="btn-secondario mt-3 w-full justify-center">
                    <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-nota" /></svg> <span x-text="t(`Aggiungi un'indicazione logistica`)"></span>
                  </button>

                  <template x-if="!editingId && importableVisits().length > 0">
                    <div class="lastra mt-6 p-4">
                      <label for="importa" class="etichetta" x-text="t(`Parti da una visita esistente`)"></label>
                      <p class="mb-2 text-caption text-muted" x-text="t(`Ne copia le tappe. L'originale non viene toccato.`)"></p>
                      <select id="importa" class="campo" @change="importVisit($event.target.value); $event.target.value=''">
                        <option value="" x-text="t(`Scegli…`)"></option>
                        <template x-for="v in importableVisits()" :key="v['@id']">
                          <option :value="v['@id']" x-text="v.name + (v.author ? ' · ' + v.author : '')"></option>
                        </template>
                      </select>
                    </div>
                  </template>
                </div>

                <!-- La libreria da cui si pesca -->
                <div x-show="editorPane === 'libreria'" class="lg:!block lg:border-l lg:border-line lg:pl-8">
                  <h2 class="font-display text-title-3" x-text="t(`La libreria`)"></h2>
                  <div class="mt-3 flex flex-col gap-3">
                    <div class="campo-cerca">
                      <svg class="h-5 w-5 shrink-0 text-muted" aria-hidden="true"><use href="#ico-cerca" /></svg>
                      <label for="cerca-ed" class="sr-only" x-text="t(`Cerca nella libreria`)"></label>
                      <input id="cerca-ed" type="search" x-model.debounce.250ms="editorSearch" :placeholder="t(`Cerca un'opera…`)">
                    </div>
                    <div x-show="currentUserRole === 'visitatore'" role="radiogroup" :aria-label="t(`Filtra la libreria`)" class="segmenti">
                      <template x-for="f in editorFilterOptions()" :key="f.v">
                        <button type="button" role="radio" :aria-checked="editorFilter === f.v" @click="editorFilter = f.v"
                          class="segmento" :class="editorFilter === f.v ? 'segmento-attivo' : ''" x-text="f.t"></button>
                      </template>
                    </div>
                  </div>

                  <ul class="mt-4 flex flex-col gap-2">
                    <template x-for="g in editorLibrary()" :key="g.artwork['@id']">
                      <li class="lastra overflow-hidden" x-data="{ aperta: false, rotta: false }">
                        <button type="button" @click="aperta = !aperta" :aria-expanded="aperta"
                          class="riga-figurata filo-accento w-full text-left">
                          <span class="figura-riga">
                            <img x-show="artworkImage(g.artwork) && !rotta" :src="artworkImage(g.artwork)" @error="rotta = true" alt="" loading="lazy">
                          </span>
                          <span class="riga-corpo flex items-center gap-3">
                            <span class="min-w-0 flex-1">
                              <span class="block truncate font-medium" x-text="g.artwork.name"></span>
                              <span class="tabular block text-caption text-muted"
                                x-text="artworkCount(g)"></span>
                            </span>
                            <svg class="h-4 w-4 shrink-0 text-muted" aria-hidden="true"><use :href="aperta ? '#ico-su' : '#ico-giu'" /></svg>
                          </span>
                        </button>
                        <ul x-show="aperta" x-collapse class="flex flex-col gap-2 border-t border-line p-3">
                          <template x-for="it in g.items" :key="it['@id']">
                            <li class="flex items-center gap-3">
                              <span class="min-w-0 flex-1">
                                <span class="pastiglia" :class="toneClass(it.educationalLevel)" x-text="t(it.educationalLevel)"></span>
                                <span class="tabular ml-2 text-caption text-muted" x-text="it.timeRequired + 's · '"></span><span class="valore text-caption" x-text="readablePrice(it.price)"></span>
                              </span>
                              <button type="button" @click="addStop('item', it['@id'])" :disabled="itemInVisit(it['@id'])"
                                class="btn-secondario shrink-0"
                                :aria-label="addToPathLabel(it, g.artwork.name)">
                                <span x-text="itemInVisit(it['@id']) ? 'Aggiunta' : 'Aggiungi'"></span>
                              </button>
                            </li>
                          </template>
                        </ul>
                      </li>
                    </template>
                  </ul>
                  <div x-show="editorLibrary().length === 0" class="vuoto mt-4">
                    <p x-text="t(`Nessuna descrizione disponibile.`)"></p>
                  </div>
                </div>
              </div>
            </div>

            <!-- PASSO 2: impostazioni -->
            <div x-show="visitStep === 'impostazioni'" class="mt-6 max-w-2xl flex flex-col gap-8">
              <template x-if="currentUserRole === 'autore'">
                <fieldset>
                  <legend class="etichetta" x-text="t(`Come si accede a questa visita`)"></legend>
                  <div class="mt-3 flex flex-col gap-3" role="radiogroup" :aria-label="t(`Tipo di visita`)">
                    <label class="scelta cursor-pointer" :class="!draft.guidata ? 'scelta-attiva' : ''">
                      <input type="radio" name="tipo-visita" value="false" x-model.boolean="draft.guidata" class="sr-only">
                      <span class="font-medium" x-text="t(`In vetrina`)"></span>
                      <span class="mt-1 block text-caption text-muted" x-text="t(`Chiunque la trova nel catalogo e la adotta.`)"></span>
                    </label>
                    <label class="scelta cursor-pointer" :class="draft.guidata ? 'scelta-attiva' : ''">
                      <input type="radio" name="tipo-visita" value="true" x-model.boolean="draft.guidata" class="sr-only">
                      <span class="font-medium" x-text="t(`Guidata, con parola chiave`)"></span>
                      <span class="mt-1 block text-caption text-muted" x-text="t(`Gratuita e fuori dal catalogo: la conduci tu, gli studenti entrano con la parola chiave.`)"></span>
                    </label>
                  </div>
                </fieldset>
              </template>

              <!-- LA COPERTINA. Facoltativa: senza, la tessera resta il titolo
                   sulla struttura, che e' come le visite si sono sempre viste.
                   L'anteprima c'e' perche' altrimenti, riaprendo una visita
                   gia' pubblicata, non ci sarebbe modo di sapere se una
                   copertina c'e' — e senza saperlo non la si puo' togliere. -->
              <div>
                <label for="v-immagine" class="etichetta" x-text="t(`Immagine (facoltativa)`)"></label>
                <input id="v-immagine" type="file" accept="image/jpeg,image/png,image/webp"
                  class="campo" @change="caricaImmagine($event)">
                <p class="mt-1 text-caption text-muted" x-text="t(`Senza, la tessera resta il titolo sul fondo scuro. JPG, PNG o WebP, fino a 4 MB.`)"></p>
                <div x-show="draft.immagine" class="mt-3 flex items-center gap-4">
                  <img :src="draft.immagine" alt="" class="h-20 w-28 rounded-plate object-cover">
                  <button type="button" class="btn-secondario" @click="draft.immagine = ''"
                    x-text="t(`Togli l'immagine`)"></button>
                </div>
              </div>

              <div x-show="draft.guidata">
                <label for="v-chiave" class="etichetta" x-text="t(`Parola chiave`)"></label>
                <p class="mb-2 text-caption text-muted" x-text="t(`Facile da dire ad alta voce e da scrivere. Dev'essere unica.`)"></p>
                <input id="v-chiave" type="text" x-model="draft.accessKey" class="campo font-mono" :placeholder="t(`Fenice rossa`)">
              </div>

              <div x-show="currentUserRole === 'autore' && !draft.guidata" class="grid gap-6 sm:grid-cols-2">
                <div>
                  <label for="v-prezzo" class="etichetta" x-text="t(`Prezzo (€)`)"></label>
                  <input id="v-prezzo" type="number" step="0.10" min="0" x-model="draft.price" class="campo tabular">
                </div>
                <div>
                  <label for="v-licenza" class="etichetta" x-text="t(`Licenza`)"></label>
                  <select id="v-licenza" x-model="draft.license" class="campo">
                    <template x-for="l in licenseOptions" :key="l"><option :value="l" x-text="l"></option></template>
                  </select>
                </div>
              </div>

              <p x-show="draft.guidata" class="avviso" role="note">
                <svg class="h-5 w-5 shrink-0" aria-hidden="true"><use href="#ico-attenzione" /></svg>
                <span x-text="t(`Una visita guidata è sempre gratuita e non compare nel catalogo, quindi il prezzo non si imposta.`)"></span>
              </p>
            </div>

            <!-- PASSO 3: quiz -->
            <div x-show="visitStep === 'quiz'" class="mt-6 max-w-2xl">
              <div class="flex items-baseline justify-between">
                <h2 class="font-display text-title-2" x-text="t(`Quiz di fine visita`)"></h2>
                <span class="tabular text-caption text-muted" x-text="draft.quiz.length + ' domande'"></span>
              </div>
              <p class="mt-1 text-small text-muted" x-text="t(`Facoltativo. Gli studenti lo svolgono nell'app da museo quando decidi tu, e il voto è il numero di risposte corrette.`)"></p>

              <ol class="mt-6 flex flex-col gap-4">
                <template x-for="(q, qi) in draft.quiz" :key="qi">
                  <li class="lastra p-5">
                    <div class="mb-3 flex items-center justify-between">
                      <h3 class="text-caption uppercase tracking-wider text-muted" x-text="'Domanda ' + (qi+1)"></h3>
                      <button type="button" @click="removeQuizQuestion(qi)" class="icona-mini text-danger"
                        :aria-label="'Rimuovi la domanda ' + (qi+1)">
                        <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-elimina" /></svg>
                      </button>
                    </div>
                    <label :for="'q-' + qi" class="sr-only" x-text="t(`Testo della domanda`)"></label>
                    <input :id="'q-' + qi" type="text" x-model="q.question" class="campo" :placeholder="t(`Che cosa distingue il manierismo?`)">
                    <fieldset class="mt-4">
                      <legend class="text-caption uppercase tracking-wider text-muted" x-text="t(`Opzioni: segna quella corretta`)"></legend>
                      <div class="mt-2 flex flex-col gap-2">
                        <template x-for="(opt, oi) in q.options" :key="oi">
                          <label class="flex items-center gap-3 rounded-plate border border-line p-2"
                            :class="q.correct === oi ? 'border-accent' : ''">
                            <input type="radio" :name="'corretta-' + qi" :value="oi" x-model.number="q.correct"
                              class="h-5 w-5 shrink-0 accent-[var(--accent)]"
                              :aria-label="'Segna come corretta l\'opzione ' + (oi+1) + ' della domanda ' + (qi+1)">
                            <span class="sr-only" :id="'lbl-' + qi + '-' + oi" x-text="'Opzione ' + (oi+1)"></span>
                            <input type="text" x-model="q.options[oi]" class="campo campo-piatto flex-1"
                              :aria-labelledby="'lbl-' + qi + '-' + oi" :placeholder="'Opzione ' + (oi+1)">
                          </label>
                        </template>
                      </div>
                    </fieldset>
                  </li>
                </template>
              </ol>

              <button type="button" @click="addQuizQuestion()" class="btn-secondario mt-4">
                <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-componi" /></svg> <span x-text="t(`Aggiungi una domanda`)"></span>
              </button>
              <div x-show="draft.quiz.length === 0" class="vuoto mt-4">
                <p x-text="t(`Nessuna domanda: la visita non avrà quiz.`)"></p>
              </div>
            </div>

            <!-- Barra di salvataggio, comune ai tre passi. Si pubblica solo
                 dall'ultimo passo: prima si arriva comunque alle impostazioni. -->
            <div class="barra-salva mt-8">
              <p class="text-small" :class="visitIssues().length ? 'text-muted' : 'text-sage'" role="status" x-text="visitStatus()"></p>
              <template x-if="nextVisitStep()">
                <button type="button" @click="visitStep = nextVisitStep()" class="btn-primario"
                  x-text="nextVisitStepLabel()"></button>
              </template>
              <template x-if="!nextVisitStep()">
                <button type="button" @click="saveVisit()" class="btn-primario" x-text="publishLabel()"></button>
              </template>
            </div>
          </section>

          <!-- ---------- VENDITE ---------- -->
          <section x-show="view === 'vendite'"
            x-init="watchSales(); $watch('view', () => watchSales())">
            <h1 class="font-display text-title-1" x-text="t(`Vendite e adozioni`)"></h1>
            <p class="mt-1 text-small text-muted" x-text="selectedMuseum ? selectedMuseum.name : ''"></p>

            <div class="mt-6 flex flex-wrap gap-4">
              <div class="lastra px-5 py-4">
                <p class="text-caption uppercase tracking-wider text-muted" x-text="t(`Adozioni`)"></p>
                <p class="tabular font-display text-title-1" x-text="totalAdoptions()"></p>
              </div>
              <div class="lastra px-5 py-4">
                <p class="text-caption uppercase tracking-wider text-muted" x-text="t(`Ricavo`)"></p>
                <p class="valore font-display text-title-1" x-text="'€ ' + totalRevenue().toFixed(2)"></p>
              </div>
            </div>

            <div class="lastra mt-8 overflow-x-auto">
              <table class="w-full text-left text-small">
                <caption class="sr-only" x-text="t(`Contenuti pubblicati, con licenza, prezzo, adozioni e ricavo`)"></caption>
                <thead>
                  <tr class="border-b border-line bg-surface-2 text-caption uppercase tracking-wider text-muted">
                    <th scope="col" class="px-4 py-3 font-medium" x-text="t(`Contenuto`)"></th>
                    <th scope="col" class="px-4 py-3 font-medium" x-text="t(`Tipo`)"></th>
                    <th scope="col" class="px-4 py-3 font-medium" x-text="t(`Licenza`)"></th>
                    <th scope="col" class="px-4 py-3 text-right font-medium" x-text="t(`Prezzo`)"></th>
                    <th scope="col" class="px-4 py-3 text-right font-medium" x-text="t(`Adozioni`)"></th>
                    <th scope="col" class="px-4 py-3 text-right font-medium" x-text="t(`Ricavo`)"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="r in filteredSales()" :key="r.id">
                    <tr class="border-b border-line transition-colors last:border-0 hover:bg-surface-2">
                      <th scope="row" class="px-4 py-3 font-medium" x-text="r.name"></th>
                      <td class="px-4 py-3"><span class="pastiglia pastiglia-ametista" x-text="r.type"></span></td>
                      <td class="px-4 py-3 text-muted" x-text="r.license"></td>
                      <td class="valore px-4 py-3 text-right" x-text="catalogPriceLabel(r)"></td>
                      <td class="tabular px-4 py-3 text-right font-medium" x-text="r.adozioni"></td>
                      <td class="valore px-4 py-3 text-right font-medium" x-text="readableRevenue(r)"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div x-show="filteredSales().length === 0" class="vuoto border-0">
                <p x-text="t(`Non hai pubblicato nulla in questo museo.`)"></p>
              </div>
            </div>
            <p class="mt-3 text-caption text-muted" x-text="t(`Il ricavo di un contenuto gratuito non è «€ 0,00»: non esiste. Quello che conta, per il gratuito, è la diffusione.`)"></p>
          </section>

          <!-- ---------- GESTIONE DEL MUSEO ---------- -->
          <section x-show="view === 'gestione'">
            <h1 class="font-display text-title-1" x-text="t(`Gestione del museo`)"></h1>
            <p class="mt-1 text-small text-muted" x-text="selectedMuseum ? selectedMuseum.name : ''"></p>

            <template x-if="overview">
              <div>
                <div class="mt-6 flex flex-wrap gap-4">
                  <template x-for="c in [
                      {etichetta:'Opere',          n: overview.conteggi.opere},
                      {etichetta:'Descrizioni',    n: overview.conteggi.item},
                      {etichetta:'Visite',         n: overview.conteggi.visite},
                      {etichetta:'Visite guidate', n: overview.conteggi.visiteGuidate}
                    ]" :key="c.etichetta">
                    <div class="lastra px-5 py-4">
                      <p class="text-caption uppercase tracking-wider text-muted" x-text="c.etichetta"></p>
                      <p class="tabular font-display text-title-1" x-text="c.n"></p>
                    </div>
                  </template>
                </div>

                <!-- COPERTURA -->
                <h2 class="mt-10 font-display text-title-2" x-text="t(`Copertura del catalogo`)"></h2>
                <p class="mt-1 text-small text-muted" x-text="t(`Opere con almeno una descrizione, per tono.`)"></p>
                <ul class="lastra mt-4 divide-y divide-line">
                  <template x-for="r in overview.copertura.perTono" :key="r.tono">
                    <li class="flex items-center gap-4 px-5 py-4">
                      <span class="w-28 shrink-0 text-small font-medium" x-text="r.tono"></span>
                      <!-- La barra e' ACQUISITO e non accento: dice quanto del
                           catalogo esiste gia', non un posto dove si puo' andare.
                           L'accento qui direbbe "clicca", che questa barra non fa. -->
                      <span class="h-2 flex-1 overflow-hidden rounded-full" style="background-color: var(--sage-velo)">
                        <span class="block h-full rounded-full"
                          :class="r.opere === 0 ? 'bg-danger' : 'bg-sage'"
                          :style="'width:' + percentualeCopertura(r) + '%'"></span>
                      </span>
                      <span class="tabular w-20 shrink-0 text-right text-small"
                        :class="r.opere === 0 ? 'text-danger font-medium' : 'text-muted'"
                        x-text="r.opere + ' / ' + overview.copertura.opereTotali"></span>
                    </li>
                  </template>
                </ul>

                <div x-show="overview.copertura.senzaDescrizione.length > 0" class="avviso mt-4">
                  <p>
                    <strong x-text="overview.copertura.senzaDescrizione.length"></strong>
                    <span x-text="senzaDescrizioneLabel()"></span>
                    <span x-text="overview.copertura.senzaDescrizione.map(o => o.name).join(', ')"></span>
                  </p>
                </div>

                <!-- OPERE DEL MUSEO -->
                <h2 class="mt-10 font-display text-title-2" x-text="t(`Opere del museo`)"></h2>
                <p class="mt-1 text-small text-muted"
                  x-text="t(`Il codice è quello di Wikidata: nome, autore e immagine arrivano da lì, la posizione dalla mappa. Aggiungere un'opera non crea descrizioni: le scrive il seed o un autore.`)"></p>

                <form class="mt-4 flex flex-wrap items-end gap-3" @submit.prevent="aggiungiOpera()">
                  <div class="min-w-[14rem] flex-1">
                    <label for="nuova-opera" class="etichetta" x-text="t(`Codice Wikidata`)"></label>
                    <input id="nuova-opera" type="text" class="campo" x-model="nuovaOperaQid"
                      placeholder="Q12418" :disabled="aggiungendoOpera">
                  </div>
                  <button type="submit" class="btn-primario" :disabled="aggiungendoOpera || !nuovaOperaQid.trim()"
                    x-text="aggiungendoOpera ? t(`Aggiungo…`) : t(`Aggiungi l'opera`)"></button>
                </form>

                <ul class="lastra mt-4 divide-y divide-line">
                  <template x-for="a in museumArtworks()" :key="a['@id']">
                    <li class="flex items-center gap-4 px-5 py-3">
                      <span class="flex-1 text-small font-medium" x-text="a.name || a.qid"></span>
                      <span class="tabular text-caption text-muted" x-text="a.qid"></span>
                      <button type="button" class="btn-pericolo" @click="openDeleteArtwork(a)"
                        :aria-label="t(`Rimuovi dal catalogo {opera}`, { opera: a.name || a.qid })"
                        x-text="t(`Rimuovi`)"></button>
                    </li>
                  </template>
                </ul>
                <p x-show="museumArtworks().length === 0" class="vuoto mt-4"
                  x-text="t(`Questo museo non ha ancora opere.`)"></p>

                <p class="mt-10 text-caption text-muted">
                  <span x-text="t(`Account registrati:`)"></span>
                  <span x-text="accountLine()"></span>
                </p>

                <!-- SVUOTAMENTO: sta in fondo, staccato e in rosso, perche' e'
                     l'unico comando della schermata che distrugge invece di
                     mostrare. I numeri che sparirebbero sono quelli qui sopra. -->
                <div class="mt-10 rounded-card border border-danger/40 p-5">
                  <h2 class="font-display text-title-3 text-danger" x-text="t(`Svuotare il catalogo`)"></h2>
                  <p class="mt-2 max-w-prose text-small text-muted"
                    x-text="t(`Elimina opere, descrizioni e visite di questo museo, e le toglie dalle librerie di chi le aveva prese. Le immagini restano sul disco e il museo resta selezionabile: per rifare il catalogo si riesegue il seed.`)"></p>
                  <button type="button" class="btn-pericolo-pieno mt-4" @click="openWipeMuseum()"
                    x-text="t(`Svuota il catalogo di questo museo`)"></button>
                </div>
              </div>
            </template>

            <div x-show="!overview" class="vuoto mt-6">
              <p x-text="t(`Sto leggendo lo stato del museo…`)"></p>
            </div>
          </section>

          <!-- ---------- CATALOGO DEL MUSEO ---------- -->
          <section x-show="view === 'catalogo'">
            <h1 class="font-display text-title-1" x-text="t(`Catalogo del museo`)"></h1>
            <p class="mt-1 text-small text-muted" x-text="selectedMuseum ? selectedMuseum.name : ''"></p>
            <p class="mt-3 text-small text-muted" x-text="t(`Comprende le descrizioni private e le visite guidate. L'eliminazione è definitiva.`)"></p>

            <div class="mt-6 flex flex-wrap items-end gap-4">
              <div class="min-w-[16rem] flex-1">
                <label for="cerca-catalogo" class="etichetta" x-text="t(`Cerca`)"></label>
                <input id="cerca-catalogo" type="search" class="campo" x-model.debounce.250ms="catalogSearch"
                  :placeholder="t(`Titolo, autore, tono o codice Wikidata`)">
              </div>
              <div>
                <span class="etichetta" id="tipo-catalogo-label" x-text="t(`Tipo`)"></span>
                <div class="segmenti" role="group" aria-labelledby="tipo-catalogo-label">
                  <button type="button" class="segmento" :class="catalogTypeFilter === 'tutti' ? 'segmento-attivo' : ''"
                    :aria-pressed="catalogTypeFilter === 'tutti'" @click="setCatalogType('tutti')" x-text="t(`Tutto`)"></button>
                  <button type="button" class="segmento" :class="catalogTypeFilter === 'opere' ? 'segmento-attivo' : ''"
                    :aria-pressed="catalogTypeFilter === 'opere'" @click="setCatalogType('opere')" x-text="t(`Opere`)"></button>
                  <button type="button" class="segmento" :class="catalogTypeFilter === 'descrizioni' ? 'segmento-attivo' : ''"
                    :aria-pressed="catalogTypeFilter === 'descrizioni'" @click="setCatalogType('descrizioni')" x-text="t(`Descrizioni`)"></button>
                  <button type="button" class="segmento" :class="catalogTypeFilter === 'visite' ? 'segmento-attivo' : ''"
                    :aria-pressed="catalogTypeFilter === 'visite'" @click="setCatalogType('visite')" x-text="t(`Visite`)"></button>
                </div>
              </div>
              <div x-show="catalogTypeFilter === 'tutti' || catalogTypeFilter === 'descrizioni'">
                <span class="etichetta" id="soggetto-catalogo-label" x-text="t(`Soggetto`)"></span>
                <div class="segmenti" role="group" aria-labelledby="soggetto-catalogo-label">
                  <button type="button" class="segmento" :class="catalogSubjectFilter === 'tutti' ? 'segmento-attivo' : ''"
                    :aria-pressed="catalogSubjectFilter === 'tutti'" @click="setCatalogSubject('tutti')" x-text="t(`Tutti`)"></button>
                  <button type="button" class="segmento" :class="catalogSubjectFilter === 'opera' ? 'segmento-attivo' : ''"
                    :aria-pressed="catalogSubjectFilter === 'opera'" @click="setCatalogSubject('opera')" x-text="t(`Opere`)"></button>
                  <button type="button" class="segmento" :class="catalogSubjectFilter === 'meta' ? 'segmento-attivo' : ''"
                    :aria-pressed="catalogSubjectFilter === 'meta'" @click="setCatalogSubject('meta')" x-text="t(`Autori e stili`)"></button>
                </div>
              </div>
              <div x-show="catalogTypeFilter !== 'opere'">
                <label for="tono-catalogo" class="etichetta" x-text="t(`Tono`)"></label>
                <select id="tono-catalogo" class="campo" x-model="catalogToneFilter">
                  <option value="tutti" x-text="t(`Tutti i toni`)"></option>
                  <template x-for="tono in tones" :key="tono">
                    <option :value="tono" x-text="t(tono)"></option>
                  </template>
                </select>
              </div>
              <div x-show="catalogTypeFilter !== 'opere'">
                <label for="autore-catalogo" class="etichetta" x-text="t(`Autore`)"></label>
                <select id="autore-catalogo" class="campo" x-model="catalogAuthorFilter">
                  <option value="tutti" x-text="t(`Tutti gli autori`)"></option>
                  <template x-for="a in catalogAuthors()" :key="a">
                    <option :value="a" x-text="a"></option>
                  </template>
                </select>
              </div>
              <div x-show="catalogDurationOptions().length > 0">
                <label for="durata-catalogo" class="etichetta" x-text="t(`Durata`)"></label>
                <select id="durata-catalogo" class="campo" x-model="catalogDurationFilter">
                  <option value="tutti" x-text="t(`Qualsiasi durata`)"></option>
                  <template x-for="d in catalogDurationOptions()" :key="d.value">
                    <option :value="d.value" x-text="d.label"></option>
                  </template>
                </select>
              </div>
            </div>
            <p x-show="catalogTypeFilter === 'tutti'" class="mt-2 text-caption text-muted">
              <span x-text="t(`Scegli Descrizioni o Visite per filtrare anche per durata. Tono, autore e durata parlano dei contenuti: accendendone uno le opere restano fuori.`)"></span>
            </p>

            <p class="mt-4 text-small text-muted" role="status">
              <span class="tabular" x-text="catalogRows().length"></span>
              <span x-text="catalogRows().length === 1 ? ' risultato' : ' risultati'"></span>
            </p>

            <div class="lastra mt-3 overflow-x-auto">
              <table class="w-full text-left text-small">
                <caption class="sr-only" x-text="t(`Contenuti e visite del museo, con autore, tono, durata, prezzo e azione di eliminazione`)"></caption>
                <thead>
                  <tr class="border-b border-line bg-surface-2 text-caption uppercase tracking-wider text-muted">
                    <th scope="col" class="px-4 py-3 font-medium" x-text="t(`Titolo`)"></th>
                    <th scope="col" class="px-4 py-3 font-medium" x-text="t(`Tipo`)"></th>
                    <th scope="col" class="px-4 py-3 font-medium" x-text="t(`Autore`)"></th>
                    <th scope="col" class="px-4 py-3 font-medium" x-text="t(`Tono`)"></th>
                    <th scope="col" class="px-4 py-3 text-right font-medium" x-text="t(`Durata`)"></th>
                    <th scope="col" class="px-4 py-3 text-right font-medium" x-text="t(`Prezzo`)"></th>
                    <th scope="col" class="px-4 py-3 text-right font-medium" x-text="t(`Azione`)"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="r in catalogRows()" :key="r.kind + r.id">
                    <tr class="border-b border-line transition-colors last:border-0 hover:bg-surface-2">
                      <th scope="row" class="px-4 py-3 font-medium">
                        <span x-text="r.name"></span>
                        <span x-show="r.privato" class="pastiglia pastiglia-ametista ml-2" x-text="t(`Privata`)"></span>
                        <span x-show="r.guidata" class="pastiglia pastiglia-ametista ml-2" x-text="t(`Guidata`)"></span>
                        <span x-show="r.kind === 'opera'" class="mt-1 block text-caption font-normal text-muted"
                          x-text="catalogRowCaption(r)"></span>
                      </th>
                      <td class="px-4 py-3">
                        <span class="pastiglia" :class="r.kind === 'opera' ? 'pastiglia-accento' : 'pastiglia-ametista'"
                          x-text="catalogRowLabel(r)"></span>
                      </td>
                      <td class="px-4 py-3 text-muted" x-text="r.author"></td>
                      <td class="px-4 py-3">
                        <span x-show="r.tone" class="pastiglia" :class="toneClass(r.tone)" x-text="t(r.tone)"></span>
                        <span x-show="!r.tone" class="text-muted">n/d</span>
                      </td>
                      <td class="tabular px-4 py-3 text-right" x-text="durationLabel(r)"></td>
                      <td class="valore px-4 py-3 text-right" x-text="catalogPriceLabel(r)"></td>
                      <td class="px-4 py-3 text-right">
                        <button type="button" class="btn-pericolo" @click="openDeleteRow(r)"
                          :aria-label="(r.kind === 'opera' ? t(`Rimuovi`) : t(`Elimina`)) + ' ' + r.name"
                          x-text="r.kind === 'opera' ? t(`Rimuovi`) : t(`Elimina`)"></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div x-show="catalogRows().length === 0" class="vuoto border-0">
                <p x-text="t(`Nessun contenuto corrisponde a quello che hai cercato.`)"></p>
              </div>
            </div>
          </section>

        </div>
      </main>
    </div>

    <div x-show="confirmOpen" @keydown.escape.window="cancelConfirm()"
      class="fixed inset-0 z-50 flex items-center justify-center bg-black/55 p-6" x-transition.opacity>
      <div role="alertdialog" aria-modal="true" aria-labelledby="conferma-titolo" aria-describedby="conferma-testo"
        x-trap.inert.noscroll="confirmOpen" @click.away="cancelConfirm()"
        class="max-h-[85vh] w-full max-w-md overflow-y-auto rounded-card border border-line bg-surface p-7 shadow-l2">
        <h2 id="conferma-titolo" class="font-display text-title-2" x-text="confirmTitle()"></h2>
        <p id="conferma-testo" class="mt-3 text-body text-muted" x-text="confirmMessage()"></p>

        <!-- SCELTA SULLE VISITE: solo quando quel che si toglie e' una tappa di qualche visita -->
        <fieldset x-show="(operaToDelete || itemToDelete) && visiteInGioco().length > 0" class="mt-5 rounded-card border border-line p-4">
          <legend class="px-1 text-small font-medium" x-text="t(`Che ne faccio delle visite?`)"></legend>
          <label class="flex cursor-pointer items-start gap-3 py-1">
            <input type="radio" name="scelta-visite" class="mt-1" value="accorcia"
              :checked="visiteScelta === 'accorcia'" @change="scegliVisite('accorcia')" />
            <span>
              <span class="block text-small font-medium" x-text="t(`Accorciale`)"></span>
              <span class="block text-caption text-muted" x-text="esitoScelta('accorcia')"></span>
            </span>
          </label>
          <label class="flex cursor-pointer items-start gap-3 py-1">
            <input type="radio" name="scelta-visite" class="mt-1" value="elimina"
              :checked="visiteScelta === 'elimina'" @change="scegliVisite('elimina')" />
            <span>
              <span class="block text-small font-medium" x-text="t(`Eliminale`)"></span>
              <span class="block text-caption text-muted" x-text="esitoScelta('elimina')"></span>
            </span>
          </label>
        </fieldset>

        <div class="mt-7 flex justify-end gap-3">
          <button type="button" @click="cancelConfirm()" class="btn-secondario" x-text="t(`Annulla`)"></button>
          <button type="button" @click="runConfirm()" :disabled="!confirmReady()"
            :class="(visitToDelete || itemToDelete || museoToWipe) ? 'btn-pericolo-pieno' : 'btn-primario'"
            x-text="confirmVerb()"></button>
        </div>
      </div>
    </div>

    <div x-show="toast" x-transition class="fixed bottom-24 left-1/2 z-50 w-[min(28rem,90vw)] -translate-x-1/2 md:bottom-6 md:left-auto md:right-6 md:translate-x-0">
      <div :role="toast?.tipo === 'error' ? 'alert' : 'status'"
        class="flex items-start gap-3 rounded-card border border-line bg-surface p-4 shadow-l2"
        :class="toast?.tipo === 'error' ? 'border-l-4 border-l-danger' : 'border-l-4 border-l-sage'">
        <svg x-show="toast?.tipo === 'error'" class="h-5 w-5 shrink-0 text-danger" aria-hidden="true"><use href="#ico-attenzione" /></svg>
        <svg x-show="toast?.tipo !== 'error'" class="h-5 w-5 shrink-0 text-sage" aria-hidden="true"><use href="#ico-check" /></svg>
        <p class="flex-1 text-small" x-text="toast?.messaggio"></p>
        <button type="button" @click="closeToast()" :aria-label="t(`Chiudi l'avviso`)" class="icona-mini">
          <svg class="h-4 w-4" aria-hidden="true"><use href="#ico-chiudi" /></svg>
        </button>
      </div>
    </div>

  </div>
</body>

</html>
